<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="早期与末期对照示意图:左栏三条指数曲线早前同涨同跌由盈利与通胀等共同因素驱动;右栏8月三条曲线分道扬镳,道指独自延续五连胜标签,标普与纳指刚从两个月的低谷爬出">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">三条跑道,从同向到分道扬镳</text>

  <!-- divider -->
  <line x1="340" y1="52" x2="340" y2="330" stroke="#ddd4c4" stroke-width="1.5"/>

  <!-- LEFT: earlier, moving together -->
  <text x="170" y="64" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">早些时候 · 同涨同跌</text>

  <polyline points="60,220 100,200 140,180 180,165 220,150 260,140" fill="none" stroke="#4f6b8a" stroke-width="2.4"/>
  <polyline points="60,230 100,215 140,195 180,178 220,160 260,148" fill="none" stroke="#4f6b8a" stroke-width="2.4" opacity="0.7"/>
  <polyline points="60,240 100,222 140,205 180,188 220,168 260,155" fill="none" stroke="#4f6b8a" stroke-width="2.4" opacity="0.45"/>

  <text x="60" y="256" font-family="system-ui,sans-serif" font-size="9" fill="#6b8299">道指</text>
  <text x="60" y="268" font-family="system-ui,sans-serif" font-size="9" fill="#6b8299">标普 · 纳指</text>

  <text x="170" y="290" font-family="'Noto Serif SC',serif" font-size="11" fill="#4f6b8a" text-anchor="middle">分布式计算</text>
  <text x="170" y="306" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">盈利、订单、通胀等多路</text>
  <text x="170" y="320" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">现实输入,同向推动三条线</text>

  <!-- RIGHT: August, diverging -->
  <text x="510" y="64" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">8月 · 分道扬镳</text>

  <!-- dow line, keeps rising, gold -->
  <polyline points="400,190 440,178 480,165 520,150 560,132 600,116" fill="none" stroke="#c8a96a" stroke-width="2.8"/>
  <text x="606" y="112" font-family="system-ui,sans-serif" font-size="9.5" fill="#b07d33">道指 · 五连涨</text>

  <!-- sp500 / nasdaq lines, dip then climb from bottom -->
  <polyline points="400,190 430,215 460,232 490,220 520,200 560,182 600,170" fill="none" stroke="#a8453a" stroke-width="2.4"/>
  <polyline points="400,195 430,222 460,240 490,226 520,208 560,190 600,178" fill="none" stroke="#a8453a" stroke-width="2.4" opacity="0.65"/>
  <text x="606" y="166" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a">标普</text>
  <text x="606" y="180" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a">纳指</text>
  <text x="490" y="248" font-family="system-ui,sans-serif" font-size="8.5" fill="#c07a70" text-anchor="middle">连跌两个月的坑</text>

  <text x="510" y="290" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#a8453a" text-anchor="middle">同一枚勋章</text>
  <text x="510" y="306" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">只挂在权重表算法不同的</text>
  <text x="510" y="320" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">那一条跑道上</text>

  <text x="40" y="346" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7280">机制示意 · 左边是三条线由同一批现实因素共同推动,右边是同一个月里,三条线已经各跑各的</text>
</svg>
