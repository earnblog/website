<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="示意图:左侧一只手按下回购按钮,右侧一整张由节点组成的美债定价网络;下方一条时间轴显示公告日利率下跌9个基点,次日涨回5.4个基点,几乎原样弹回">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="38" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">按钮按得动网络,算不完账本</text>

  <!-- 左:按钮 -->
  <rect x="60" y="70" width="150" height="90" rx="10" fill="#fbf9f4" stroke="#b07d33" stroke-width="1.6"/>
  <circle cx="135" cy="105" r="18" fill="#c8a96a"/>
  <text x="135" y="111" font-family="system-ui,sans-serif" font-size="14" fill="#fbf9f4" text-anchor="middle" font-weight="700">▼</text>
  <text x="135" y="140" font-family="'Noto Serif SC',serif" font-size="12" fill="#33404f" text-anchor="middle">回购操作</text>
  <text x="135" y="156" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a7a5c" text-anchor="middle">20亿 → 40亿美元/次</text>

  <line x1="210" y1="115" x2="270" y2="115" stroke="#b07d33" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="240" y="105" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a7a5c" text-anchor="middle">按一下</text>

  <!-- 右:网络 -->
  <g fill="#4f6b8a">
    <circle cx="310" cy="80" r="4"/><circle cx="350" cy="65" r="4"/><circle cx="395" cy="88" r="4"/>
    <circle cx="440" cy="68" r="4"/><circle cx="480" cy="90" r="4"/><circle cx="290" cy="120" r="4"/>
    <circle cx="335" cy="115" r="4"/><circle cx="378" cy="128" r="4"/><circle cx="420" cy="112" r="4"/>
    <circle cx="462" cy="122" r="4"/><circle cx="505" cy="105" r="4"/><circle cx="308" cy="155" r="4"/>
    <circle cx="352" cy="162" r="4"/><circle cx="398" cy="150" r="4"/><circle cx="442" cy="160" r="4"/>
    <circle cx="486" cy="148" r="4"/><circle cx="524" cy="130" r="4"/>
  </g>
  <g stroke="#ddd4c4" stroke-width="1">
    <line x1="310" y1="80" x2="350" y2="65"/><line x1="350" y1="65" x2="395" y2="88"/>
    <line x1="395" y1="88" x2="440" y2="68"/><line x1="440" y1="68" x2="480" y2="90"/>
    <line x1="290" y1="120" x2="335" y2="115"/><line x1="335" y1="115" x2="378" y2="128"/>
    <line x1="378" y1="128" x2="420" y2="112"/><line x1="420" y1="112" x2="462" y2="122"/>
    <line x1="462" y1="122" x2="505" y2="105"/><line x1="308" y1="155" x2="352" y2="162"/>
    <line x1="352" y1="162" x2="398" y2="150"/><line x1="398" y1="150" x2="442" y2="160"/>
    <line x1="442" y1="160" x2="486" y2="148"/><line x1="486" y1="148" x2="524" y2="130"/>
    <line x1="310" y1="80" x2="290" y2="120"/><line x1="395" y1="88" x2="378" y2="128"/>
    <line x1="480" y1="90" x2="462" y2="122"/><line x1="335" y1="115" x2="352" y2="162"/>
    <line x1="420" y1="112" x2="442" y2="160"/>
  </g>
  <text x="405" y="200" font-family="'Noto Serif SC',serif" font-size="12" fill="#33404f" text-anchor="middle">美债定价网络</text>
  <text x="405" y="216" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a7a5c" text-anchor="middle">节点=每一个持有人的账本 · 欠债规模40万亿美元</text>

  <!-- 时间轴:利率曲线先凹后弹 -->
  <line x1="70" y1="300" x2="610" y2="300" stroke="#ddd4c4" stroke-width="1"/>
  <path d="M 90 260 C 140 260, 160 300, 210 300 S 280 250, 340 236 S 400 260, 460 260" fill="none" stroke="#a8453a" stroke-width="2.6"/>
  <circle cx="210" cy="300" r="4.5" fill="#a8453a"/>
  <circle cx="340" cy="236" r="4.5" fill="#b07d33"/>
  <line x1="210" y1="300" x2="210" y2="320" stroke="#ddd4c4" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="340" y1="236" x2="340" y2="320" stroke="#ddd4c4" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="210" y="335" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">公告日:-9个基点</text>
  <text x="340" y="335" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a5a2a" text-anchor="middle">次日:+5.4个基点</text>
  <text x="90" y="335" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a7a5c">三十年期利率</text>

  <text x="405" y="352" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#6b6355" text-anchor="middle">按钮能让曲线凹下去一天,网络第二天就把它算了回来</text>
</svg>
