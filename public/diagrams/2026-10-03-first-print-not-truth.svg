<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="七月非农三次公布:减2.3万、加2.1万、减1万,正负号换了两回">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="40" y="30" font-family="system-ui,sans-serif" font-size="11.5" fill="#8a8170">七月非农新增就业(万人)· 同一个月的三次公布</text>
  <line x1="40" y1="190" x2="640" y2="190" stroke="#33404f" stroke-width="1.2"/>
  <text x="636" y="182" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#8a8170">零轴</text>
  <rect x="110" y="190" width="100" height="92" fill="#a8453a"/>
  <rect x="290" y="106" width="100" height="84" fill="#4f6b8a"/>
  <rect x="470" y="190" width="100" height="40" fill="#a8453a"/>
  <g font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="160" y="304" fill="#a8453a">–2.3</text>
    <text x="340" y="96" fill="#4f6b8a">+2.1</text>
    <text x="520" y="252" fill="#a8453a">–1.0</text>
  </g>
  <g font-family="'Noto Serif SC',serif" font-size="12.5" fill="#3a352c" text-anchor="middle">
    <text x="160" y="330">① 8月初·首次公布</text>
    <text x="340" y="330">② 9月4日·第一次修正</text>
    <text x="520" y="330">③ 10月2日·第二次修正</text>
  </g>
  <path d="M215 236 L285 150" stroke="#b07d33" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
  <path d="M395 150 L465 214" stroke="#b07d33" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
  <text x="340" y="56" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#b07d33">正负号换了两回</text>
</svg>
