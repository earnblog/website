<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="真扩散与减仓式伪轮动的对照图">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#33404f" text-anchor="middle">同样是"A跌 B涨",账本上天差地别</text>

  <!-- 分隔线 -->
  <line x1="340" y1="56" x2="340" y2="330" stroke="#ddd4c4" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 左:真扩散 -->
  <text x="170" y="78" font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" fill="#4f6b8a" text-anchor="middle">真扩散 · 总敞口 ↑</text>
  <text x="170" y="98" font-family="system-ui,sans-serif" font-size="11" fill="#6b7688" text-anchor="middle">市场在把赢家名单拉长</text>

  <!-- 外部新钱注入 -->
  <text x="170" y="128" font-family="system-ui,sans-serif" font-size="10.5" fill="#b07d33" text-anchor="middle">↓ 新钱进场</text>
  <path d="M170 134 L170 158" fill="none" stroke="#b07d33" stroke-width="1.6"/>
  <path d="M166 152 L170 160 L174 152" fill="#b07d33"/>

  <!-- 三个各自被定价的板块 -->
  <rect x="66" y="170" width="66" height="52" fill="#4f6b8a" opacity="0.85" rx="3"/>
  <text x="99" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">板块A</text>
  <rect x="140" y="170" width="66" height="52" fill="#4f6b8a" opacity="0.62" rx="3"/>
  <text x="173" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">板块B</text>
  <rect x="214" y="170" width="66" height="52" fill="#4f6b8a" opacity="0.4" rx="3"/>
  <text x="247" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#33404f" text-anchor="middle">板块C</text>
  <text x="170" y="252" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7688" text-anchor="middle">各有各的基本面,分别被重新定价</text>
  <text x="170" y="300" font-family="'Noto Serif SC',serif" font-size="12" font-weight="700" fill="#4f6b8a" text-anchor="middle">市场在分布式地计算未来</text>

  <!-- 右:减仓式伪轮动 -->
  <text x="510" y="78" font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" fill="#a8453a" text-anchor="middle">减仓 · 总敞口 ↓</text>
  <text x="510" y="98" font-family="system-ui,sans-serif" font-size="11" fill="#6b7688" text-anchor="middle">一个拥挤交易在退潮</text>

  <!-- 拥挤交易在瓦解 -->
  <rect x="404" y="150" width="86" height="66" fill="#a8453a" opacity="0.9" rx="3"/>
  <text x="447" y="180" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">拥挤交易</text>
  <text x="447" y="197" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">(AI · 在跌)</text>

  <!-- 逃跑的钱落到反面 -->
  <path d="M490 183 C540 183 560 183 566 183" fill="none" stroke="#b07d33" stroke-width="1.6" stroke-dasharray="3 4"/>
  <path d="M560 179 L568 183 L560 187" fill="#b07d33"/>
  <text x="533" y="174" font-family="system-ui,sans-serif" font-size="10" fill="#b07d33" text-anchor="middle">逃</text>

  <rect x="570" y="156" width="60" height="54" fill="#4f6b8a" opacity="0.38" rx="3"/>
  <text x="600" y="180" font-family="system-ui,sans-serif" font-size="10.5" fill="#33404f" text-anchor="middle">它的</text>
  <text x="600" y="196" font-family="system-ui,sans-serif" font-size="10.5" fill="#33404f" text-anchor="middle">反面</text>
  <text x="510" y="248" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7688" text-anchor="middle">B涨,仅仅因为它是A的反面</text>
  <text x="510" y="300" font-family="'Noto Serif SC',serif" font-size="12" font-weight="700" fill="#a8453a" text-anchor="middle">市场在给同一笔恐惧找落脚点</text>

  <!-- 图例 -->
  <line x1="66" y1="330" x2="630" y2="330" stroke="#ddd4c4" stroke-width="1"/>
  <text x="340" y="350" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a7a5c" text-anchor="middle">蓝=资金流入 / 敞口 · 红=正在瓦解的拥挤交易 · 区别不在颜色,在钱这个整体是变多还是变少</text>
</svg>
