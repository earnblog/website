<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="反身性双向闭环示意图:左环是押注加息生效,长端利率上涨、融资成本抬升、真实需求转冷、通胀真降,美联储9月16日可能不用再加,闭环自我化解;右环是押注落空,利率按兵不动、金融条件不收紧、通胀风险不解除,逼美联储被迫真加,闭环自我坐实">
  <rect width="680" height="360" fill="#fbf9f4"/>

  <defs>
    <marker id="cnc-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f6b8a"/>
    </marker>
    <marker id="cnc-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a8453a"/>
    </marker>
  </defs>

  <text x="40" y="34" font-family="'Noto Serif SC',serif" font-size="14.5" font-weight="700" fill="#2b2b2b">同一场押注,两种结局</text>

  <line x1="340" y1="52" x2="340" y2="336" stroke="#ddd4c4" stroke-width="1.4" stroke-dasharray="3,4"/>

  <!-- LEFT: bet takes effect, self-defusing loop (healthy negative feedback) -->
  <text x="168" y="62" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">押注生效·自我化解</text>

  <g>
    <path d="M 90 100 A 78 78 0 1 1 89 101" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#cnc-arrow-blue)"/>
  </g>

  <rect x="52" y="88" width="108" height="30" rx="4" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="106" y="107" font-family="system-ui,sans-serif" font-size="9.5" fill="#4f6b8a" text-anchor="middle">长端利率先涨</text>

  <rect x="200" y="140" width="108" height="30" rx="4" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="254" y="159" font-family="system-ui,sans-serif" font-size="9.5" fill="#4f6b8a" text-anchor="middle">融资成本抬升</text>

  <rect x="150" y="198" width="108" height="30" rx="4" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="204" y="217" font-family="system-ui,sans-serif" font-size="9.5" fill="#4f6b8a" text-anchor="middle">真实需求转冷</text>

  <rect x="40" y="198" width="98" height="30" rx="4" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="89" y="217" font-family="system-ui,sans-serif" font-size="9.5" fill="#4f6b8a" text-anchor="middle">通胀真的降温</text>

  <circle cx="106" cy="270" r="34" fill="none" stroke="#4f6b8a" stroke-width="1.8"/>
  <text x="106" y="266" font-family="'Noto Serif SC',serif" font-size="10.5" font-weight="700" fill="#4f6b8a" text-anchor="middle">9月16日</text>
  <text x="106" y="280" font-family="system-ui,sans-serif" font-size="9" fill="#4f6b8a" text-anchor="middle">可以不加了</text>

  <text x="170" y="322" font-family="'Noto Serif SC',serif" font-size="11" fill="#4f6b8a" text-anchor="middle">押对的预期,把自己变得没必要</text>

  <!-- RIGHT: bet falls short, self-fulfilling loop (dangerous positive feedback) -->
  <text x="512" y="62" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">押注落空·自我坐实</text>

  <g>
    <path d="M 590 100 A 78 78 0 1 1 589 101" fill="none" stroke="#a8453a" stroke-width="1.8" marker-end="url(#cnc-arrow-red)"/>
  </g>

  <rect x="552" y="88" width="108" height="30" rx="4" fill="#fbf9f4" stroke="#a8453a" stroke-width="1.5"/>
  <text x="606" y="107" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">利率按兵不动</text>

  <rect x="486" y="140" width="120" height="30" rx="4" fill="#fbf9f4" stroke="#a8453a" stroke-width="1.5"/>
  <text x="546" y="159" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">金融条件没收紧</text>

  <rect x="440" y="198" width="120" height="30" rx="4" fill="#fbf9f4" stroke="#a8453a" stroke-width="1.5"/>
  <text x="500" y="217" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">通胀风险不解除</text>

  <rect x="580" y="198" width="98" height="30" rx="4" fill="#fbf9f4" stroke="#a8453a" stroke-width="1.5"/>
  <text x="629" y="217" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">逼出真加息</text>

  <circle cx="606" cy="270" r="34" fill="none" stroke="#a8453a" stroke-width="1.8"/>
  <text x="606" y="266" font-family="'Noto Serif SC',serif" font-size="10.5" font-weight="700" fill="#a8453a" text-anchor="middle">9月16日</text>
  <text x="606" y="280" font-family="system-ui,sans-serif" font-size="9" fill="#a8453a" text-anchor="middle">被迫真加</text>

  <text x="546" y="322" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a" text-anchor="middle">不信邪的松懈,把自己坐成现实</text>

  <text x="40" y="346" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7280">机制示意 · 左边押对了会让加息变得没必要,右边不信邪反而把加息逼成必然</text>
</svg>
