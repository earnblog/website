<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="左右对照:左边两头一起涨的回路,开支被读成领导力,收入被读成需求证明,两头互相作证;右边账单翻面,开支推迟,付钱的涨,收钱的跌">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <line x1="340" y1="40" x2="340" y2="320" stroke="#ddd4c4" stroke-width="1.5"/>
  <text x="170" y="24" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" fill="#4f6b8a">回路顺转:两头互相作证</text>
  <text x="510" y="24" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" fill="#a8453a">回路倒转:账单记回成本</text>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f6b8a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a8453a"/></marker>
  </defs>
  <rect x="40" y="70" width="110" height="54" rx="6" fill="#4f6b8a"/>
  <text x="95" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fbf9f4">付钱的</text>
  <text x="95" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fbf9f4">云厂商 ↑</text>
  <rect x="190" y="70" width="110" height="54" rx="6" fill="#c8a96a"/>
  <text x="245" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#33404f">收钱的</text>
  <text x="245" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">芯片公司 ↑</text>
  <path d="M110 128 Q170 200 230 128" fill="none" stroke="#4f6b8a" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M232 66 Q170 0 108 66" fill="none" stroke="#4f6b8a" stroke-width="2" marker-end="url(#ab)"/>
  <text x="170" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">开支 = "领导力",变成对方的收入</text>
  <text x="170" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">收入 = "需求证明"</text>
  <text x="170" y="236" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#4f6b8a">减号被抹掉:两头都算利好</text>
  <text x="170" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">左脚踩右脚,越踩越高</text>
  <line x1="390" y1="150" x2="630" y2="190" stroke="#33404f" stroke-width="5" stroke-linecap="round"/>
  <path d="M495 214 L525 214 L510 172 Z" fill="#33404f"/>
  <rect x="380" y="106" width="96" height="44" rx="6" fill="#4f6b8a" transform="rotate(9.5 510 170)"/>
  <rect x="548" y="150" width="96" height="44" rx="6" fill="#a8453a" transform="rotate(9.5 510 170)"/>
  <text x="428" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">付钱的:少花一笔 ↑</text>
  <text x="604" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">收钱的:发票晚到 ↓</text>
  <path d="M600 76 L600 112" stroke="#a8453a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="600" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">消息:开支被推迟</text>
  <text x="510" y="266" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#a8453a">同一个减号,被记回账上</text>
  <text x="510" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">一头的成本,就是另一头的收入</text>
  <text x="340" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a94a6">蓝 = 付钱的一头 · 金/红 = 收钱的一头 · 示意,非比例</text>
</svg>
