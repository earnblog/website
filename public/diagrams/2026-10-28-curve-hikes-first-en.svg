<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Line chart: the 2-year Treasury yield rose from 4.39% in early September to 4.67% the day before the Fed hiked; after the September 16 hike the effective fed funds rate moved from 3.63% to 3.88% and stayed flat; the 2-year peaked at 4.92% and was back to 4.70% on October 27, about 80 basis points above the effective rate">
<rect width="680" height="360" fill="#fbf9f4"/>
