<text x="62" y="150.7" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">4.5%</text>
<line x1="70" y1="70.0" x2="620" y2="70.0" stroke="#ddd4c4" stroke-width="1"/>
<text x="62" y="74.0" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">5.0%</text>
