<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="同一个PMI数字被两本账分别计算的镜像图:左栏国债账本,输入综合PMI58.4,读出经济过热、加息概率上升,结论是抛售国债、收益率创新高,标红色;右栏股票账本,输入同一个58.4,读出订单与盈利同步扩张,结论是持股不动、指数原地踏步,标蓝色;中间虚线分隔,顶部标注同一个数字,两本账各算各的">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="38" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">同一个数字,两本账各算各的</text>
  <text x="340" y="58" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a7d63" text-anchor="middle">输入同为:9月综合PMI初值 58.4(五年多以来最高)</text>

  <!-- center divider -->
  <line x1="340" y1="76" x2="340" y2="330" stroke="#ddd4c4" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- left ledger: bond market -->
  <text x="170" y="98" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">国债账本</text>
  <rect x="80" y="116" width="180" height="40" fill="none" stroke="#a8453a" stroke-width="1.4"/>
  <text x="170" y="140" font-family="system-ui,sans-serif" font-size="10.5" fill="#7a3428" text-anchor="middle">读出:经济过热</text>
  <line x1="170" y1="156" x2="170" y2="180" stroke="#a8453a" stroke-width="1.4"/>
  <path d="M 163 172 L 170 182 L 177 172" fill="none" stroke="#a8453a" stroke-width="1.4"/>
  <rect x="80" y="182" width="180" height="40" fill="none" stroke="#a8453a" stroke-width="1.4"/>
  <text x="170" y="206" font-family="system-ui,sans-serif" font-size="10.5" fill="#7a3428" text-anchor="middle">10月大概率再加息</text>
  <line x1="170" y1="222" x2="170" y2="246" stroke="#a8453a" stroke-width="1.4"/>
  <path d="M 163 238 L 170 248 L 177 238" fill="none" stroke="#a8453a" stroke-width="1.4"/>
  <rect x="80" y="248" width="180" height="44" fill="#a8453a" fill-opacity="0.12" stroke="#a8453a" stroke-width="1.8"/>
  <text x="170" y="270" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#a8453a" text-anchor="middle" font-weight="700">抛售国债</text>
  <text x="170" y="286" font-family="system-ui,sans-serif" font-size="10" fill="#a8453a" text-anchor="middle">收益率冲上2007年以来新高</text>

  <!-- right ledger: stock market -->
  <text x="510" y="98" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">股票账本</text>
  <rect x="420" y="116" width="180" height="40" fill="none" stroke="#4f6b8a" stroke-width="1.4"/>
  <text x="510" y="140" font-family="system-ui,sans-serif" font-size="10.5" fill="#33526b" text-anchor="middle">读出:订单在扩张</text>
  <line x1="510" y1="156" x2="510" y2="180" stroke="#4f6b8a" stroke-width="1.4"/>
  <path d="M 503 172 L 510 182 L 517 172" fill="none" stroke="#4f6b8a" stroke-width="1.4"/>
  <rect x="420" y="182" width="180" height="40" fill="none" stroke="#4f6b8a" stroke-width="1.4"/>
  <text x="510" y="206" font-family="system-ui,sans-serif" font-size="10.5" fill="#33526b" text-anchor="middle">盈利增速追得上利率</text>
  <line x1="510" y1="222" x2="510" y2="246" stroke="#4f6b8a" stroke-width="1.4"/>
  <path d="M 503 238 L 510 248 L 517 238" fill="none" stroke="#4f6b8a" stroke-width="1.4"/>
  <rect x="420" y="248" width="180" height="44" fill="#4f6b8a" fill-opacity="0.12" stroke="#4f6b8a" stroke-width="1.8"/>
  <text x="510" y="270" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#4f6b8a" text-anchor="middle" font-weight="700">持股不动</text>
  <text x="510" y="286" font-family="system-ui,sans-serif" font-size="10" fill="#4f6b8a" text-anchor="middle">道指纳指标普几乎原地踏步</text>

  <text x="340" y="322" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#8a7d63" text-anchor="middle">没有一本账错了,是两本账从来没打算算同一件事</text>
</svg>
