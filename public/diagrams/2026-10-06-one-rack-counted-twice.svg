<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="供应链示意图:云厂商下订单,英伟达芯片出货,富士康机柜出货,前两本账记的是同一台机柜,独立的证据在链条末端的终端使用">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="40" y="30" font-family="system-ui,sans-serif" font-size="11.5" fill="#8a8170">同一条供应链 · 三本账 · 一台机柜</text>
  <g font-family="'Noto Serif SC',serif" font-size="13" text-anchor="middle">
    <rect x="30" y="120" width="130" height="64" rx="4" fill="#fbf9f4" stroke="#33404f" stroke-width="1.4"/>
    <text x="95" y="148" fill="#33404f" font-weight="700">云厂商</text><text x="95" y="168" fill="#8a8170" font-size="11.5">下订单</text>
    <rect x="195" y="120" width="130" height="64" rx="4" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.6"/>
    <text x="260" y="148" fill="#4f6b8a" font-weight="700">英伟达</text><text x="260" y="168" fill="#8a8170" font-size="11.5">芯片出货</text>
    <rect x="360" y="120" width="130" height="64" rx="4" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.6"/>
    <text x="425" y="148" fill="#4f6b8a" font-weight="700">富士康</text><text x="425" y="168" fill="#8a8170" font-size="11.5">机柜出货</text>
    <rect x="525" y="120" width="130" height="64" rx="4" fill="#fbf9f4" stroke="#c8a96a" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="590" y="148" fill="#b07d33" font-weight="700">终端使用</text><text x="590" y="168" fill="#8a8170" font-size="11.5">谁在付钱用</text>
  </g>
  <g stroke="#33404f" stroke-width="1.4" fill="none"><path d="M160 152 L193 152"/><path d="M325 152 L358 152"/><path d="M490 152 L523 152"/></g>
  <path d="M260 120 C260 70 425 70 425 120" stroke="#a8453a" stroke-width="1.6" fill="none"/>
  <text x="342" y="66" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a">同一台机柜,数了两遍</text>
  <path d="M590 184 L590 250" stroke="#b07d33" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="590" y="274" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#b07d33">独立证据在这里</text>
  <g font-family="system-ui,sans-serif" font-size="11.5" fill="#8a8170"><text x="260" y="320" text-anchor="middle">这一段内部的"互相印证",只是回声</text></g>
  <path d="M195 300 L490 300" stroke="#a8453a" stroke-width="1.2"/>
</svg>
