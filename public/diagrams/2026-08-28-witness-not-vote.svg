<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="两栏对照示意图:左栏是CrowdStrike的客户续约、新增合同等多个互不相识的独立输入汇聚成真实增长;右栏是Salesforce投资浮盈推高每股利润、利润推高股价、股价反过来印证叙事,首尾相接成一个自证闭环">
  <rect width="680" height="360" fill="#fbf9f4"/>

  <defs>
    <marker id="wnv-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#33404f"/>
    </marker>
    <marker id="wnv-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f6b8a"/>
    </marker>
    <marker id="wnv-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a8453a"/>
    </marker>
  </defs>

  <text x="40" y="34" font-family="'Noto Serif SC',serif" font-size="14.5" font-weight="700" fill="#2b2b2b">同一天的两份证词,不是同一件事</text>

  <line x1="340" y1="52" x2="340" y2="330" stroke="#ddd4c4" stroke-width="1.4" stroke-dasharray="3,4"/>

  <!-- LEFT: CrowdStrike distributed real growth -->
  <text x="170" y="64" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">CrowdStrike·外人自己签的单</text>

  <rect x="52" y="82" width="130" height="34" rx="4" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="117" y="103" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">老客户续约</text>

  <rect x="52" y="132" width="130" height="34" rx="4" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="117" y="153" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">新客户签约</text>

  <rect x="52" y="182" width="130" height="34" rx="4" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="117" y="203" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">新增合同规模</text>

  <path d="M 182 99 L 230 132" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#wnv-arrow-blue)"/>
  <path d="M 182 149 L 230 145" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#wnv-arrow-blue)"/>
  <path d="M 182 199 L 230 158" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#wnv-arrow-blue)"/>

  <circle cx="255" cy="150" r="30" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="255" y="146" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#4f6b8a" text-anchor="middle">真实增长</text>
  <text x="255" y="162" font-family="system-ui,sans-serif" font-size="8.5" fill="#6b8299" text-anchor="middle">各自独立签下</text>

  <text x="170" y="240" font-family="'Noto Serif SC',serif" font-size="11" fill="#4f6b8a" text-anchor="middle">分布式计算</text>
  <text x="170" y="256" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">签单的人和被验证的对象</text>
  <text x="170" y="270" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">不是同一个</text>

  <!-- RIGHT: Salesforce self-loop -->
  <text x="510" y="64" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">Salesforce·自己给自己作证</text>

  <rect x="440" y="86" width="140" height="36" rx="4" fill="none" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="108" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">Anthropic投资浮盈</text>

  <path d="M 510 122 L 510 148" fill="none" stroke="#a8453a" stroke-width="1.8" marker-end="url(#wnv-arrow-red)"/>

  <rect x="440" y="150" width="140" height="36" rx="4" fill="none" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="172" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">每股利润被拉高</text>

  <path d="M 510 186 L 510 212" fill="none" stroke="#a8453a" stroke-width="1.8" marker-end="url(#wnv-arrow-red)"/>

  <rect x="440" y="214" width="140" height="36" rx="4" fill="none" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="236" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">股价暴涨22.6%</text>

  <path d="M 580 232 C 615 200, 615 120, 580 100" fill="none" stroke="#a8453a" stroke-width="1.8" marker-end="url(#wnv-arrow-red)"/>
  <text x="628" y="168" font-family="system-ui,sans-serif" font-size="9" fill="#a8453a" text-anchor="middle" transform="rotate(90 628 168)">反过来印证叙事</text>

  <text x="510" y="290" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a" text-anchor="middle">自问自答</text>
  <text x="510" y="306" font-family="system-ui,sans-serif" font-size="9.5" fill="#c58c82" text-anchor="middle">作证的人和被验证的对象</text>
  <text x="510" y="320" font-family="system-ui,sans-serif" font-size="9.5" fill="#c58c82" text-anchor="middle">是同一个</text>

  <text x="40" y="346" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7280">机制示意 · 左边是许多独立客户各自签单汇总出的真实增长,右边是同一家公司自己的账本,自己给自己作证</text>
</svg>
