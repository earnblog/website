<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="两种刹车对照图:左侧一句呼吁需要所有人同意,四支箭头里只要有一支不减速,其余三支让出的份额就被它接走,整体失效;右侧资金的价格是一道横压下来的实线,四支箭头被同时压低,不需要任何人同意">
  <rect width="680" height="360" fill="#fbf9f4"/>

  <text x="40" y="34" font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" fill="#33404f">两种刹车</text>
  <text x="40" y="54" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a8272">一种需要所有人同意,一种不需要任何人同意</text>

  <line x1="340" y1="72" x2="340" y2="312" stroke="#ddd4c4" stroke-width="1"/>

  <!-- LEFT: moral suasion -->
  <text x="40" y="92" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#4f6b8a">一句呼吁</text>
  <text x="40" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#8a8272">劝 · 要所有人点头才算数</text>

  <line x1="40" y1="290" x2="316" y2="290" stroke="#ddd4c4" stroke-width="1"/>

  <!-- three who slow down -->
  <g stroke="#4f6b8a" stroke-width="2.2" fill="none">
    <path d="M 66 286 C 78 252, 84 236, 86 214"/>
    <path d="M 116 286 C 128 252, 134 236, 136 214"/>
    <path d="M 166 286 C 178 252, 184 236, 186 214"/>
  </g>
  <g fill="#4f6b8a">
    <circle cx="86" cy="210" r="3.2"/><circle cx="136" cy="210" r="3.2"/><circle cx="186" cy="210" r="3.2"/>
  </g>
  <text x="136" y="198" font-family="system-ui,sans-serif" font-size="10" fill="#4f6b8a" text-anchor="middle">三个人慢下来</text>

  <!-- one defector keeps going -->
  <path d="M 246 286 C 250 226, 254 186, 256 136" stroke="#a8453a" stroke-width="2.6" fill="none"/>
  <path d="M 249 146 L 256 132 L 263 146" fill="none" stroke="#a8453a" stroke-width="2.6"/>
  <text x="256" y="122" font-family="system-ui,sans-serif" font-size="10" fill="#a8453a" text-anchor="middle">一个人不慢</text>

  <!-- transferred share -->
  <path d="M 196 214 C 216 208, 232 196, 246 184" stroke="#b07d33" stroke-width="1.8" fill="none" stroke-dasharray="4,3"/>
  <path d="M 238 182 L 248 182 L 246 192" fill="none" stroke="#b07d33" stroke-width="1.8"/>
  <text x="212" y="238" font-family="system-ui,sans-serif" font-size="10" fill="#b07d33">让出的份额</text>

  <text x="40" y="322" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a">结果:总量没慢,份额换了个人拿</text>

  <!-- RIGHT: the price of money -->
  <text x="368" y="92" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#a8453a">资金的价格</text>
  <text x="368" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#8a8272">判 · 不问任何人同不同意</text>

  <line x1="368" y1="290" x2="644" y2="290" stroke="#ddd4c4" stroke-width="1"/>

  <!-- the clamp -->
  <line x1="368" y1="196" x2="644" y2="196" stroke="#a8453a" stroke-width="2.6"/>
  <text x="644" y="188" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a" text-anchor="end">十年期美债 5%</text>
  <g stroke="#a8453a" stroke-width="1.4">
    <line x1="410" y1="196" x2="410" y2="212"/><line x1="406" y1="206" x2="410" y2="213"/><line x1="414" y1="206" x2="410" y2="213"/>
    <line x1="490" y1="196" x2="490" y2="212"/><line x1="486" y1="206" x2="490" y2="213"/><line x1="494" y1="206" x2="490" y2="213"/>
    <line x1="570" y1="196" x2="570" y2="212"/><line x1="566" y1="206" x2="570" y2="213"/><line x1="574" y1="206" x2="570" y2="213"/>
  </g>

  <!-- four arrows all pressed to the same height -->
  <g stroke="#4f6b8a" stroke-width="2.2" fill="none">
    <path d="M 396 286 C 404 258, 406 244, 406 226"/>
    <path d="M 456 286 C 464 258, 466 244, 466 226"/>
    <path d="M 516 286 C 524 258, 526 244, 526 226"/>
    <path d="M 576 286 C 584 258, 586 244, 586 226"/>
  </g>
  <g fill="#4f6b8a">
    <circle cx="406" cy="222" r="3.2"/><circle cx="466" cy="222" r="3.2"/><circle cx="526" cy="222" r="3.2"/><circle cx="586" cy="222" r="3.2"/>
  </g>
  <text x="496" y="250" font-family="system-ui,sans-serif" font-size="10" fill="#4f6b8a" text-anchor="middle">四个人一起慢,慢得整整齐齐</text>

  <text x="368" y="322" font-family="'Noto Serif SC',serif" font-size="11" fill="#33404f">结果:没人被说服,所有人都慢了</text>

  <text x="40" y="348" font-family="system-ui,sans-serif" font-size="10" fill="#8a8272">劝可以不听,判由不得你</text>
</svg>
