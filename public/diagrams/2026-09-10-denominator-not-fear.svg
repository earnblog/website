<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="三周前后对照示意图:左侧是三周前,多路数据——就业、零售、通胀——共同决定这道除法分母的涨跌,标注为分布式输入;右侧是这几天,几乎只剩原油单日涨跌一个变量在决定分母,标注为单一输入收窄">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">分母的算法没变,喂给它的输入变窄了</text>

  <!-- divider -->
  <line x1="340" y1="52" x2="340" y2="332" stroke="#ddd4c4" stroke-width="1.5"/>

  <!-- LEFT: three weeks ago, distributed inputs -->
  <text x="170" y="72" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">三周前 · 多路输入</text>

  <g fill="#4f6b8a">
    <circle cx="110" cy="112" r="5"/>
    <circle cx="170" cy="100" r="5"/>
    <circle cx="230" cy="112" r="5"/>
  </g>
  <text x="110" y="132" font-family="system-ui,sans-serif" font-size="9.5" fill="#33404f" text-anchor="middle">就业数据</text>
  <text x="170" y="120" font-family="system-ui,sans-serif" font-size="9.5" fill="#33404f" text-anchor="middle">零售数据</text>
  <text x="230" y="132" font-family="system-ui,sans-serif" font-size="9.5" fill="#33404f" text-anchor="middle">通胀数据</text>

  <path d="M 110 138 L 165 178" stroke="#4f6b8a" stroke-width="1.6" fill="none"/>
  <path d="M 170 126 L 170 178" stroke="#4f6b8a" stroke-width="1.6" fill="none"/>
  <path d="M 230 138 L 175 178" stroke="#4f6b8a" stroke-width="1.6" fill="none"/>

  <rect x="110" y="182" width="120" height="44" rx="6" fill="#eef1ea" stroke="#4f6b8a" stroke-width="1.4"/>
  <text x="170" y="208" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#33404f" text-anchor="middle">分母(贴现率)</text>

  <text x="170" y="250" font-family="system-ui,sans-serif" font-size="9.5" fill="#6b8299" text-anchor="middle">谁也不能单独说了算</text>

  <!-- RIGHT: this week, single input -->
  <text x="510" y="72" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">这几天 · 单一输入</text>

  <circle cx="510" cy="112" r="6" fill="#a8453a"/>
  <text x="510" y="132" font-family="system-ui,sans-serif" font-size="9.5" fill="#33404f" text-anchor="middle">原油单日涨跌</text>

  <path d="M 510 138 L 510 178" stroke="#a8453a" stroke-width="1.8" fill="none"/>

  <rect x="450" y="182" width="120" height="44" rx="6" fill="#f7ece9" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="208" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#33404f" text-anchor="middle">分母(贴现率)</text>

  <text x="510" y="250" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">一桶油当天说了算</text>

  <text x="170" y="286" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#4f6b8a" text-anchor="middle">分布式计算</text>
  <text x="510" y="286" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#a8453a" text-anchor="middle">单一变量自循环</text>

  <text x="40" y="346" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7280">机制示意 · 决定分母涨跌的输入变量,这几周从多路收窄成了近乎一路</text>
</svg>
