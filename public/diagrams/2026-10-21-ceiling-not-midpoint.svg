<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="两次三季报区间对照:左侧2025年区间从100–125整体上移到120–130,价格点上移;右侧2026年区间从140–160收窄为145–155,上沿被剪掉一截,价格点被迫下移">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <line x1="340" y1="30" x2="340" y2="320" stroke="#ddd4c4" stroke-width="1"/>
  <g font-family="'Noto Serif SC',serif" font-size="14" font-weight="700">
    <text x="170" y="42" text-anchor="middle" fill="#4f6b8a">2025年三季报:上沿抬成地板</text>
    <text x="510" y="42" text-anchor="middle" fill="#a8453a">2026年三季报:上沿被往下压</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#33404f">
    <text x="40" y="96">旧区间</text><text x="40" y="176">新区间</text>
    <text x="380" y="96">旧区间</text><text x="380" y="176">新区间</text>
  </g>
  <!-- left: scale 100..130 -> x 60..300 (8px per unit) -->
  <rect x="60" y="106" width="200" height="22" rx="3" fill="#c8a96a"/>
  <text x="60" y="146" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">100</text>
  <text x="260" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">125</text>
  <rect x="220" y="186" width="80" height="22" rx="3" fill="#4f6b8a"/>
  <text x="220" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">120</text>
  <text x="300" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">130</text>
  <line x1="260" y1="128" x2="260" y2="186" stroke="#b07d33" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="250" cy="117" r="5" fill="#33404f"/>
  <circle cx="290" cy="197" r="5" fill="#33404f"/>
  <text x="170" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4f6b8a">新下沿贴着旧上沿,价格跟着往上搬</text>
  <text x="170" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4f6b8a">当天股价:涨近15%</text>
  <!-- right: scale 140..160 -> x 400..640 (12px per unit) -->
  <rect x="400" y="106" width="240" height="22" rx="3" fill="#c8a96a"/>
  <text x="400" y="146" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">140</text>
  <text x="640" y="146" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">160</text>
  <rect x="460" y="186" width="120" height="22" rx="3" fill="#4f6b8a"/>
  <rect x="580" y="186" width="60" height="22" rx="3" fill="none" stroke="#a8453a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="460" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">145</text>
  <text x="580" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">155</text>
  <line x1="520" y1="100" x2="520" y2="214" stroke="#33404f" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="520" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">中点150 不变</text>
  <circle cx="610" cy="117" r="5" fill="#a8453a"/>
  <path d="M610 124 Q 610 160 574 192" fill="none" stroke="#a8453a" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8453a"/></marker></defs>
  <text x="510" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#a8453a">价格住着的那一截被剪掉,只能往下搬</text>
  <text x="510" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#a8453a">当天股价:跌6.8%</text>
  <text x="650" y="340" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#33404f">全年调整后息税前利润指引,单位亿美元;价格点为示意</text>
</svg>
