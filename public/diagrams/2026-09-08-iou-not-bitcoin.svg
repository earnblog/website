<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="左侧示意比特币主链:密集节点互相连接组成分布式网络,标注全网算力谁也叫不停;右侧示意联邦侧链:一枚按钮连着几把钥匙图标,下方一根储备条从顶端跌到只剩细细一线,标注一次合法签名就能清空的委员会账本">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">网络,还是按钮?</text>

  <line x1="340" y1="54" x2="340" y2="316" stroke="#ddd4c4" stroke-width="1.4"/>

  <!-- LEFT: main chain, distributed network -->
  <text x="170" y="66" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#4f6b8a" text-anchor="middle">比特币主链</text>
  <text x="170" y="82" font-family="system-ui,sans-serif" font-size="10" fill="#8a8272" text-anchor="middle">分布式计算 · 没有开关</text>

  <g stroke="#4f6b8a" stroke-width="1.1" opacity="0.8">
    <line x1="80" y1="120" x2="140" y2="150"/>
    <line x1="140" y1="150" x2="100" y2="190"/>
    <line x1="100" y1="190" x2="170" y2="215"/>
    <line x1="170" y1="215" x2="225" y2="165"/>
    <line x1="225" y1="165" x2="140" y2="150"/>
    <line x1="225" y1="165" x2="270" y2="210"/>
    <line x1="80" y1="120" x2="150" y2="100"/>
    <line x1="150" y1="100" x2="225" y2="165"/>
    <line x1="100" y1="190" x2="150" y2="248"/>
    <line x1="150" y1="248" x2="270" y2="210"/>
    <line x1="270" y1="210" x2="205" y2="240"/>
    <line x1="150" y1="100" x2="270" y2="135"/>
    <line x1="270" y1="135" x2="270" y2="210"/>
    <line x1="205" y1="240" x2="150" y2="248"/>
  </g>
  <g fill="#c8a96a">
    <circle cx="80" cy="120" r="5"/>
    <circle cx="150" cy="100" r="5"/>
    <circle cx="140" cy="150" r="5"/>
    <circle cx="225" cy="165" r="5"/>
    <circle cx="270" cy="135" r="5"/>
    <circle cx="100" cy="190" r="5"/>
    <circle cx="170" cy="215" r="5"/>
    <circle cx="270" cy="210" r="5"/>
    <circle cx="150" cy="248" r="5"/>
    <circle cx="205" cy="240" r="5"/>
  </g>
  <text x="170" y="288" font-family="'Noto Serif SC',serif" font-size="11" fill="#5c6b78" text-anchor="middle">出块照常,十分钟一个</text>
  <rect x="90" y="300" width="160" height="6" rx="3" fill="#4f6b8a"/>
  <text x="170" y="322" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a8272" text-anchor="middle">没有任何一方能单独叫停</text>

  <!-- RIGHT: federation sidechain, button controls reserve -->
  <text x="510" y="66" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#a8453a" text-anchor="middle">联邦侧链钱包</text>
  <text x="510" y="82" font-family="system-ui,sans-serif" font-size="10" fill="#8a8272" text-anchor="middle">几把钥匙 · 一次签名生效</text>

  <g>
    <circle cx="460" cy="130" r="17" fill="#fff" stroke="#b07d33" stroke-width="2"/>
    <circle cx="460" cy="130" r="7" fill="#a8453a"/>
    <text x="460" y="112" font-family="system-ui,sans-serif" font-size="9" fill="#b07d33" text-anchor="middle">钥匙①</text>
  </g>
  <g>
    <circle cx="510" cy="118" r="17" fill="#fff" stroke="#b07d33" stroke-width="2"/>
    <circle cx="510" cy="118" r="7" fill="#a8453a"/>
    <text x="510" y="100" font-family="system-ui,sans-serif" font-size="9" fill="#b07d33" text-anchor="middle">钥匙②</text>
  </g>
  <g>
    <circle cx="560" cy="132" r="17" fill="#fff" stroke="#b07d33" stroke-width="2"/>
    <circle cx="560" cy="132" r="7" fill="#a8453a"/>
    <text x="560" y="114" font-family="system-ui,sans-serif" font-size="9" fill="#b07d33" text-anchor="middle">钥匙③</text>
  </g>
  <line x1="470" y1="145" x2="500" y2="155" stroke="#b07d33" stroke-width="1.2"/>
  <line x1="510" y1="135" x2="510" y2="155" stroke="#b07d33" stroke-width="1.2"/>
  <line x1="550" y1="145" x2="520" y2="155" stroke="#b07d33" stroke-width="1.2"/>

  <!-- reserve bar draining -->
  <rect x="480" y="170" width="60" height="110" fill="none" stroke="#8a8272" stroke-width="1.3"/>
  <rect x="480" y="170" width="60" height="106" fill="none" stroke="#ddd4c4" stroke-width="8" opacity="0.7"/>
  <rect x="480" y="274" width="60" height="6" fill="#a8453a"/>
  <text x="546" y="182" font-family="system-ui,sans-serif" font-size="9" fill="#8a8272">此前逾4200枚</text>
  <text x="546" y="280" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a">只剩197枚</text>

  <text x="510" y="308" font-family="'Noto Serif SC',serif" font-size="11" fill="#5c6b78" text-anchor="middle">软件一次误判,储备清零</text>
  <text x="510" y="326" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a8272" text-anchor="middle">安全等于这几把钥匙够不够谨慎</text>

  <line x1="60" y1="336" x2="620" y2="336" stroke="#ddd4c4" stroke-width="1"/>
  <text x="340" y="352" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#8a8272" text-anchor="middle">左边是没有开关的网络,右边是一个被误按的按钮</text>
</svg>
