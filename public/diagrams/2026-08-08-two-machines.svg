<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="示意图:同一份走弱的就业报告,放到经济这台机器上是往下的,放到美联储那只手上却是往上的;市场站在了后一台跟前">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#33404f" text-anchor="middle">同一个数字,两台机器读出相反的方向</text>

  <!-- 顶部:同一份报告 -->
  <rect x="196" y="56" width="288" height="46" rx="4" fill="#fff" stroke="#b07d33" stroke-width="1.6"/>
  <text x="340" y="78" font-family="'Noto Serif SC',serif" font-size="13.5" font-weight="700" fill="#33404f" text-anchor="middle">同一份报告:七月的活岗位</text>
  <text x="340" y="95" font-family="'Noto Serif SC',serif" font-size="13.5" font-weight="700" fill="#a8453a" text-anchor="middle">不增反减</text>

  <!-- 分叉 -->
  <path d="M340 102 L200 138" stroke="#ccc2b0" stroke-width="1.4" fill="none"/>
  <path d="M340 102 L480 138" stroke="#ccc2b0" stroke-width="1.4" fill="none"/>

  <!-- 左:经济这台机器,往下 -->
  <text x="200" y="160" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#33404f" text-anchor="middle">放到「经济」这台机器上</text>
  <line x1="200" y1="176" x2="200" y2="300" stroke="#a8453a" stroke-width="2.4" marker-end="url(#down)"/>
  <text x="128" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a3a">少岗位</text>
  <text x="128" y="230" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a3a">少工资</text>
  <text x="128" y="256" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a3a">少往后的需求</text>
  <text x="200" y="322" font-family="'Noto Serif SC',serif" font-size="12" fill="#a8453a" text-anchor="middle">经济 → 走弱</text>

  <!-- 右:美联储那只手,往上 -->
  <text x="480" y="160" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#33404f" text-anchor="middle">放到「美联储那只手」上</text>
  <line x1="480" y1="300" x2="480" y2="176" stroke="#c8a96a" stroke-width="2.6" marker-end="url(#up)"/>
  <text x="552" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a3a">走弱 = 不必收紧</text>
  <text x="552" y="230" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a3a">不收紧 = 钱更松</text>
  <text x="552" y="256" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a3a">钱更松 = 资产往上抬</text>
  <text x="480" y="322" font-family="'Noto Serif SC',serif" font-size="12" fill="#b07d33" text-anchor="middle">流动性 → 松开</text>

  <!-- 市场站在右边 -->
  <text x="480" y="344" font-family="'Noto Serif SC',serif" font-size="12" font-weight="700" fill="#4f6b8a" text-anchor="middle">↑ 市场站在了这一台跟前</text>

  <defs>
    <marker id="down" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto"><path d="M0 0 L9 0 L4.5 9 z" fill="#a8453a"/></marker>
    <marker id="up" markerWidth="9" markerHeight="9" refX="4.5" refY="1" orient="auto"><path d="M4.5 0 L9 9 L0 9 z" fill="#c8a96a"/></marker>
  </defs>
</svg>
