<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Diagram: the order of GDP bookkeeping. First every dollar spent on consumption, investment and inventories is recorded regardless of origin; then the foreign-made part is subtracted as imports; what remains is GDP made inside the US. Below, a mirror: when imports surge GDP looks weak while demand runs hot; when imports collapse GDP looks strong while demand may be cooling.">
<rect width="680" height="360" fill="#fbf9f4"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33404f"/></marker></defs>
<text x="40" y="34" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#33404f">The minus sign on imports: not a penalty, a return</text>
<rect x="40" y="60" width="160" height="150" rx="6" fill="#fff" stroke="#4f6b8a" stroke-width="2"/>
<text x="120" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#4f6b8a">① Record it all</text>
<text x="120" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#33404f">Consumption, investment,</text>
<text x="120" y="140" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#33404f">inventories — any origin</text>
<text x="120" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#4f6b8a">Private final sales +4.9%</text>
<rect x="260" y="60" width="160" height="150" rx="6" fill="#fff" stroke="#a8453a" stroke-width="2"/>
<text x="340" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#a8453a">② Then send it back</text>
<text x="340" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#33404f">The foreign-made part</text>
<text x="340" y="140" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#33404f">is subtracted as imports</text>
<text x="340" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#a8453a">Imports: −2.64 pts</text>
<rect x="480" y="60" width="160" height="150" rx="6" fill="#fff" stroke="#c8a96a" stroke-width="2"/>
<text x="560" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#c8a96a">③ What's left is GDP</text>
<text x="560" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#33404f">Made inside</text>
<text x="560" y="140" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#33404f">the United States</text>
<text x="560" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#c8a96a">Q3 advance: 3.4%</text>
<line x1="205" y1="135" x2="255" y2="135" stroke="#33404f" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="425" y1="135" x2="475" y2="135" stroke="#33404f" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="40" y1="232" x2="640" y2="232" stroke="#ddd4c4"/>
<rect x="40" y="248" width="290" height="78" rx="6" fill="#f3ece0"/>
<text x="56" y="272" font-family="Georgia,serif" font-size="12.5" font-weight="700" fill="#a8453a">When imports surge</text>
<text x="56" y="296" font-family="Georgia,serif" font-size="12" fill="#33404f">Bigger minus → GDP looks weak</text>
<text x="56" y="316" font-family="Georgia,serif" font-size="12" fill="#33404f">Demand may actually be running hot</text>
<rect x="350" y="248" width="290" height="78" rx="6" fill="#eef1f5"/>
<text x="366" y="272" font-family="Georgia,serif" font-size="12.5" font-weight="700" fill="#4f6b8a">When imports collapse</text>
<text x="366" y="296" font-family="Georgia,serif" font-size="12" fill="#33404f">Smaller minus → GDP looks strong</text>
<text x="366" y="316" font-family="Georgia,serif" font-size="12" fill="#33404f">Demand may actually be cooling</text>
<text x="40" y="348" font-family="system-ui,sans-serif" font-size="10" fill="#8a94a6">Data: BEA, Q3 2026 GDP advance estimate, released Oct 29</text>
</svg>