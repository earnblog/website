<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="两种自我强化循环对照图:左侧蓝色循环拴在现金流上,赚钱到回购到每股含金量上升到价格获得支撑,首尾相接;右侧红色循环拴在价格本身上,股价涨到抵押品变值钱到贷款额度做大到资金涌入叙事,调头后变为股价跌到抵押品缩水到安全垫变薄到被迫减持压低股价">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">同一种自我强化,拴在两个不同的东西上</text>

  <line x1="340" y1="54" x2="340" y2="326" stroke="#ddd4c4" stroke-width="1"/>

  <!-- left loop: cash-flow, blue -->
  <text x="170" y="68" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">拴在现金流上</text>
  <circle cx="170" cy="190" r="92" fill="none" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="170" y="106" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">① 赚钱</text>
  <text x="256" y="160" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">② 回购</text>
  <text x="230" y="270" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">③ 每股含金量升</text>
  <text x="110" y="270" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">④ 价格获支撑</text>
  <path d="M 170 118 A 92 92 0 0 1 246 168" fill="none" stroke="#4f6b8a" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <path d="M 246 212 A 92 92 0 0 1 200 258" fill="none" stroke="#4f6b8a" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <path d="M 140 258 A 92 92 0 0 1 94 212" fill="none" stroke="#4f6b8a" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <path d="M 94 168 A 92 92 0 0 1 170 118" fill="none" stroke="#4f6b8a" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <text x="170" y="194" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#33404f" text-anchor="middle">回撤时</text>
  <text x="170" y="210" font-family="system-ui,sans-serif" font-size="9.5" fill="#5a6472" text-anchor="middle">买得慢一点,现金流仍在</text>

  <!-- right loop: price-collateral, red -->
  <text x="510" y="68" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">拴在价格本身上</text>
  <circle cx="510" cy="190" r="92" fill="none" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="106" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#a8453a" text-anchor="middle">① 股价涨</text>
  <text x="596" y="160" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#a8453a" text-anchor="middle">② 抵押品变值钱</text>
  <text x="570" y="270" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#a8453a" text-anchor="middle">③ 贷款额度做大</text>
  <text x="450" y="270" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#a8453a" text-anchor="middle">④ 资金涌入叙事</text>
  <path d="M 510 118 A 92 92 0 0 1 586 168" fill="none" stroke="#a8453a" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <path d="M 586 212 A 92 92 0 0 1 540 258" fill="none" stroke="#a8453a" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <path d="M 480 258 A 92 92 0 0 1 434 212" fill="none" stroke="#a8453a" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <path d="M 434 168 A 92 92 0 0 1 510 118" fill="none" stroke="#a8453a" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <text x="510" y="194" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#a8453a" text-anchor="middle">调头时</text>
  <text x="510" y="210" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a4038" text-anchor="middle">跌→抵押品缩水→逼仓减持→更跌</text>

  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4f6b8a"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a8453a"/></marker>
  </defs>

  <text x="340" y="348" font-family="'Noto Serif SC',serif" font-size="12" fill="#33404f" text-anchor="middle">涨的时候看不出区别,跌的时候才现出原形</text>
</svg>
