<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="折现率抬头与松动的镜像图:左侧抬头阶段,靠杠杆撑价的资产最先下坠,远期现金流的公司几乎不动;右侧松动阶段,同一类杠杆资产最先蹦起,远期现金流的公司仍几乎不动">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="34" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#33404f" text-anchor="middle">同一把尺子,量出两种反应速度</text>

  <!-- divider -->
  <line x1="340" y1="56" x2="340" y2="320" stroke="#ddd4c4" stroke-width="1"/>

  <!-- left panel: rate rising -->
  <text x="170" y="66" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">折现率抬头</text>
  <line x1="60" y1="230" x2="280" y2="230" stroke="#ddd4c4" stroke-width="1"/>
  <!-- blue chip: barely moves -->
  <rect x="70" y="210" width="90" height="30" rx="3" fill="none" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="115" y="229" font-family="'Noto Serif SC',serif" font-size="11" fill="#4f6b8a" text-anchor="middle">蓝筹股</text>
  <text x="115" y="256" font-family="system-ui,sans-serif" font-size="9.5" fill="#7a8496" text-anchor="middle">几乎不动</text>
  <!-- leveraged asset: drops hard -->
  <rect x="190" y="252" width="90" height="30" rx="3" fill="none" stroke="#a8453a" stroke-width="1.8"/>
  <text x="235" y="271" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a" text-anchor="middle">杠杆资产</text>
  <path d="M 235 208 L 235 246" stroke="#a8453a" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M 228 236 L 235 248 L 242 236" fill="none" stroke="#a8453a" stroke-width="2"/>
  <text x="235" y="300" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">最先下坠</text>

  <!-- right panel: rate easing -->
  <text x="510" y="66" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#c8a96a" text-anchor="middle">折现率松动</text>
  <line x1="400" y1="230" x2="620" y2="230" stroke="#ddd4c4" stroke-width="1"/>
  <!-- blue chip: barely moves -->
  <rect x="410" y="210" width="90" height="30" rx="3" fill="none" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="455" y="229" font-family="'Noto Serif SC',serif" font-size="11" fill="#4f6b8a" text-anchor="middle">蓝筹股</text>
  <text x="455" y="256" font-family="system-ui,sans-serif" font-size="9.5" fill="#7a8496" text-anchor="middle">几乎不动</text>
  <!-- leveraged asset: jumps hard -->
  <rect x="530" y="150" width="90" height="30" rx="3" fill="none" stroke="#c8a96a" stroke-width="1.8"/>
  <text x="575" y="169" font-family="'Noto Serif SC',serif" font-size="11" fill="#b07d33" text-anchor="middle">杠杆资产</text>
  <path d="M 575 226 L 575 186" stroke="#c8a96a" stroke-width="2"/>
  <path d="M 568 198 L 575 184 L 582 198" fill="none" stroke="#c8a96a" stroke-width="2"/>
  <text x="575" y="204" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle"></text>
  <text x="575" y="200" font-family="system-ui,sans-serif" font-size="0" fill="none"></text>
  <text x="575" y="140" font-family="system-ui,sans-serif" font-size="9.5" fill="#b07d33" text-anchor="middle">最先蹦起</text>

  <text x="340" y="345" font-family="'Noto Serif SC',serif" font-size="12" fill="#33404f" text-anchor="middle">反应快慢从来不看涨跌方向,只看离杠杆的距离</text>
</svg>
