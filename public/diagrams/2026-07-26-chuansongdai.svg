<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="示意图:现货ETF是一条双向传送带,涨时把钱送进现货、跌时把钱卸出现货,同一台马达两个方向一样快">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="40" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#33404f">同一条传送带,两个方向一样快</text>

  <!-- 图例 -->
  <rect x="470" y="30" width="12" height="12" fill="#4f6b8a"/>
  <text x="488" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#5b6675">申购·进</text>
  <rect x="560" y="30" width="12" height="12" fill="#a8453a"/>
  <text x="578" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#5b6675">赎回·出</text>

  <!-- 两端 -->
  <rect x="40" y="150" width="120" height="60" rx="4" fill="#eef0ec" stroke="#5b6675" stroke-width="1.4"/>
  <text x="100" y="176" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#33404f" text-anchor="middle">场外的钱</text>
  <text x="100" y="194" font-family="system-ui,sans-serif" font-size="10" fill="#5b6675" text-anchor="middle">投顾·配置盘·散户</text>

  <rect x="520" y="150" width="120" height="60" rx="4" fill="#eef0ec" stroke="#5b6675" stroke-width="1.4"/>
  <text x="580" y="176" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#33404f" text-anchor="middle">比特币现货</text>
  <text x="580" y="194" font-family="system-ui,sans-serif" font-size="10" fill="#5b6675" text-anchor="middle">买盘/卖压落地</text>

  <!-- 传送带框 -->
  <rect x="170" y="150" width="340" height="60" rx="30" fill="#f4efe3" stroke="#ddd4c4" stroke-width="1.4"/>
  <text x="340" y="184" font-family="system-ui,sans-serif" font-size="11" fill="#8a8372" text-anchor="middle">同一台马达 · 没有偏好的方向</text>

  <!-- 上沿:向右 申购(蓝) -->
  <line x1="176" y1="132" x2="498" y2="132" stroke="#4f6b8a" stroke-width="2.4"/>
  <path d="M498 126 L512 132 L498 138 Z" fill="#4f6b8a"/>
  <text x="340" y="122" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#4f6b8a" text-anchor="middle">涨时:钱一铲一铲送进现货,放大上涨</text>

  <!-- 下沿:向左 赎回(红) -->
  <line x1="504" y1="228" x2="182" y2="228" stroke="#a8453a" stroke-width="2.4"/>
  <path d="M182 222 L168 228 L182 234 Z" fill="#a8453a"/>
  <text x="340" y="246" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#a8453a" text-anchor="middle">跌时:钱一铲一铲卸出现货,放大下跌</text>

  <line x1="40" y1="296" x2="640" y2="296" stroke="#ddd4c4" stroke-width="1"/>
  <text x="40" y="322" font-family="system-ui,sans-serif" font-size="11.5" fill="#5b6675">ETF 拆掉的是进出的摩擦,不是造了一块地板——</text>
  <text x="40" y="342" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#33404f">进场有多顺,离场就有多顺。便利,是对称的。</text>
</svg>
