<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="示意图:上方红色油价曲线先涨后跌回到原处;下方金色欠条余额线像棘轮,油价涨时一级级抬高,油价跌时停住不回落">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <g font-family="'Noto Serif SC',serif">
    <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#33404f">油价是曲线,欠条是棘轮</text>
    <line x1="60" y1="170" x2="640" y2="170" stroke="#ddd4c4"/>
    <line x1="60" y1="320" x2="640" y2="320" stroke="#ddd4c4"/>
    <line x1="350" y1="50" x2="350" y2="325" stroke="#ddd4c4" stroke-dasharray="4 4"/>
    <text x="205" y="62" text-anchor="middle" font-size="12" fill="#33404f">油价上涨:一路开出欠条</text>
    <text x="495" y="62" text-anchor="middle" font-size="12" fill="#33404f">油价下跌:只是不再开新的</text>
    <!-- oil curve -->
    <path d="M70 150 C 160 145, 230 80, 340 78 C 440 80, 520 150, 630 152" fill="none" stroke="#a8453a" stroke-width="3"/>
    <text x="74" y="140" font-size="12" fill="#a8453a">油价</text>
    <text x="600" y="142" font-size="11" fill="#a8453a">回到原处</text>
    <!-- ratchet -->
    <path d="M70 300 H130 L140 280 H190 L200 260 H250 L260 240 H310 L320 220 H630" fill="none" stroke="#c8a96a" stroke-width="4"/>
    <text x="74" y="292" font-size="12" fill="#b07d33">欠条余额</text>
    <text x="520" y="212" font-size="11" fill="#b07d33">停在高处,不往回落</text>
    <g fill="#33404f" font-size="10.5" font-family="system-ui,sans-serif">
      <text x="135" y="304">工资补涨</text>
      <text x="195" y="284">租约重签</text>
      <text x="255" y="264">价目上调</text>
    </g>
    <path d="M390 222 v40 M380 252 l10 12 l10 -12" stroke="#4f6b8a" stroke-width="2" fill="none" opacity="0.35"/>
    <line x1="376" y1="236" x2="404" y2="262" stroke="#a8453a" stroke-width="2.5"/>
    <line x1="404" y1="236" x2="376" y2="262" stroke="#a8453a" stroke-width="2.5"/>
    <text x="414" y="254" font-size="10.5" fill="#33404f" font-family="system-ui,sans-serif">油价下跌不会把余额拉回来</text>
    <text x="340" y="346" text-anchor="middle" font-size="11" fill="#33404f">整体通胀跟着油价走;核心通胀只听欠条的</text>
  </g>
</svg>
