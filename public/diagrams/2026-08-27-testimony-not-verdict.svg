<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="两栏对照示意图:左栏是多个互不相识的外部买家各自独立下单,箭头汇聚成真实需求信号;右栏是英伟达自己对自己产能表态,形成自问自答的单一闭环,中间用一架天平分隔两栏">
  <rect width="680" height="360" fill="#fbf9f4"/>

  <defs>
    <marker id="tnv-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#33404f"/>
    </marker>
    <marker id="tnv-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a8453a"/>
    </marker>
  </defs>

  <text x="40" y="34" font-family="'Noto Serif SC',serif" font-size="14.5" font-weight="700" fill="#2b2b2b">两种证据,不是同一件事</text>

  <!-- divider -->
  <line x1="340" y1="52" x2="340" y2="330" stroke="#ddd4c4" stroke-width="1.4" stroke-dasharray="3,4"/>

  <!-- LEFT column: distributed real buyers -->
  <text x="170" y="64" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#4f6b8a" text-anchor="middle">外人自己算过账</text>

  <rect x="52" y="82" width="130" height="34" rx="4" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="117" y="103" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">AWS·2百万颗GPU</text>

  <rect x="52" y="132" width="130" height="34" rx="4" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="117" y="153" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">其他云厂商订单</text>

  <rect x="52" y="182" width="130" height="34" rx="4" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <text x="117" y="203" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">企业自建算力预算</text>

  <path d="M 182 99 L 230 132" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#tnv-arrow)"/>
  <path d="M 182 149 L 230 145" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#tnv-arrow)"/>
  <path d="M 182 199 L 230 158" fill="none" stroke="#4f6b8a" stroke-width="1.8" marker-end="url(#tnv-arrow)"/>

  <circle cx="255" cy="150" r="30" fill="#fbf9f4" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="255" y="146" font-family="'Noto Serif SC',serif" font-size="11" font-weight="700" fill="#4f6b8a" text-anchor="middle">真实需求</text>
  <text x="255" y="162" font-family="system-ui,sans-serif" font-size="8.5" fill="#6b8299" text-anchor="middle">各自独立算出</text>

  <text x="170" y="240" font-family="'Noto Serif SC',serif" font-size="11" fill="#4f6b8a" text-anchor="middle">分布式计算</text>
  <text x="170" y="256" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">买单的人和被验证的对象</text>
  <text x="170" y="270" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">不是同一个</text>

  <!-- RIGHT column: self-testimony loop -->
  <text x="510" y="64" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">自己给自己作证</text>

  <rect x="440" y="110" width="140" height="42" rx="4" fill="none" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="128" font-family="'Noto Serif SC',serif" font-size="12" fill="#a8453a" text-anchor="middle">英伟达:供给上限</text>
  <text x="510" y="144" font-family="system-ui,sans-serif" font-size="10" fill="#a8453a" text-anchor="middle">"我们保证七成"</text>

  <path d="M 555 152 C 590 175, 590 210, 555 230" fill="none" stroke="#a8453a" stroke-width="1.8" marker-end="url(#tnv-arrow-red)"/>

  <rect x="440" y="230" width="140" height="42" rx="4" fill="none" stroke="#a8453a" stroke-width="1.6"/>
  <text x="510" y="248" font-family="'Noto Serif SC',serif" font-size="12" fill="#a8453a" text-anchor="middle">市场:念作判决书</text>
  <text x="510" y="264" font-family="system-ui,sans-serif" font-size="10" fill="#a8453a" text-anchor="middle">"需求被证实了"</text>

  <path d="M 465 230 C 430 210, 430 175, 465 152" fill="none" stroke="#a8453a" stroke-width="1.8" marker-end="url(#tnv-arrow-red)"/>

  <text x="510" y="296" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a" text-anchor="middle">自问自答</text>
  <text x="510" y="312" font-family="system-ui,sans-serif" font-size="9.5" fill="#c58c82" text-anchor="middle">说话的人和被验证的对象</text>
  <text x="510" y="326" font-family="system-ui,sans-serif" font-size="9.5" fill="#c58c82" text-anchor="middle">是同一个</text>

  <text x="40" y="346" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7280">机制示意 · 左边是许多人各自算完账后掏出的真金白银,右边是同一家公司自己问、自己答</text>
</svg>
