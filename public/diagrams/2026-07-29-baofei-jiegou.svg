<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="示意图:从期货价格反推出来的概率由判断与保费两段构成,决议落地后归零或归一">
  <rect width="680" height="340" fill="#fbf9f4"/>
  <text x="40" y="38" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#3a3630">一个数字,两种读法</text>

  <!-- 上排:链条 -->
  <text x="40" y="72" font-family="system-ui,sans-serif" font-size="11" fill="#8a8375">它是怎么来的(整条链上没人被问过"你觉得会加息吗")</text>

  <rect x="40" y="84" width="118" height="40" rx="3" fill="#fff" stroke="#b9b0a0" stroke-width="1.3"/>
  <text x="99" y="109" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#3a3630" text-anchor="middle">有人买保护</text>

  <path d="M162 104 L192 104" stroke="#b9b0a0" stroke-width="1.3"/><path d="M192 104 l-7 -3.5 v7 z" fill="#b9b0a0"/>

  <rect x="196" y="84" width="118" height="40" rx="3" fill="#fff" stroke="#b9b0a0" stroke-width="1.3"/>
  <text x="255" y="109" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#3a3630" text-anchor="middle">期货价格变动</text>

  <path d="M318 104 L348 104" stroke="#b9b0a0" stroke-width="1.3"/><path d="M348 104 l-7 -3.5 v7 z" fill="#b9b0a0"/>

  <rect x="352" y="84" width="118" height="40" rx="3" fill="#fff" stroke="#b9b0a0" stroke-width="1.3"/>
  <text x="411" y="109" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#3a3630" text-anchor="middle">反推出「概率」</text>

  <path d="M474 104 L504 104" stroke="#a8453a" stroke-width="1.3"/><path d="M504 104 l-7 -3.5 v7 z" fill="#a8453a"/>

  <rect x="508" y="84" width="132" height="40" rx="3" fill="#f7ece9" stroke="#a8453a" stroke-width="1.3"/>
  <text x="574" y="109" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#a8453a" text-anchor="middle">标题:市场预期</text>

  <!-- 反身回路 -->
  <path d="M574 128 Q574 156 300 156 Q99 156 99 130" fill="none" stroke="#a8453a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M99 130 l-3.5 8 h7 z" fill="#a8453a"/>
  <text x="340" y="171" font-family="system-ui,sans-serif" font-size="11" fill="#a8453a" text-anchor="middle">读到标题的人跟着调仓,保费再被推高——左脚踩右脚</text>

  <!-- 下排:成分拆解 -->
  <text x="40" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#8a8375">这个数字里装着什么</text>
  <rect x="40" y="222" width="76" height="40" fill="#eef2f6" stroke="#4f6b8a" stroke-width="1.4"/>
  <text x="78" y="247" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#4f6b8a" text-anchor="middle">判断</text>
  <rect x="116" y="222" width="284" height="40" fill="#f7ece9" stroke="#a8453a" stroke-width="1.4"/>
  <text x="258" y="247" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#a8453a" text-anchor="middle">输不起的人愿意多付的钱</text>

  <!-- 到期 -->
  <line x1="424" y1="214" x2="424" y2="286" stroke="#c8a96a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="424" y="206" font-family="system-ui,sans-serif" font-size="11" fill="#a08447" text-anchor="middle">决议落地</text>
  <rect x="448" y="222" width="90" height="40" fill="#fff" stroke="#b9b0a0" stroke-width="1.3"/>
  <text x="493" y="247" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#3a3630" text-anchor="middle">归零</text>
  <rect x="546" y="222" width="90" height="40" fill="#fff" stroke="#b9b0a0" stroke-width="1.3"/>
  <text x="591" y="247" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#3a3630" text-anchor="middle">归一</text>
  <text x="519" y="282" font-family="system-ui,sans-serif" font-size="11" fill="#8a8375" text-anchor="middle">不记功,也不记过</text>

  <line x1="40" y1="304" x2="640" y2="304" stroke="#e2dbcd" stroke-width="1"/>
  <text x="40" y="326" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#3a3630">一个到期就归零、事后没人复盘对错的东西,从来不是预测,是保费。</text>
</svg>
