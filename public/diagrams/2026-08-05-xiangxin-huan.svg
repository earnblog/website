<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="示意图:相信、股价、业绩首尾相接的反身性正反馈环,顺着转一路强化,倒着转一路瓦解">
  <rect width="680" height="360" fill="#fbf9f4"/>
  <text x="340" y="30" font-family="'Noto Serif SC',serif" font-size="15.5" font-weight="700" fill="#33404f" text-anchor="middle">相信 → 股价 → 业绩 → 相信:左脚踩右脚的自我强化</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#b07d33"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#4f6b8a"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a8453a"/></marker>
  </defs>

  <!-- 反向外环:相信松口,倒着转 -->
  <path d="M300 62 A150 150 0 0 0 190 180" fill="none" stroke="#c9b79a" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <path d="M190 180 A150 150 0 0 0 300 298" fill="none" stroke="#c9b79a" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ar)"/>

  <!-- 顺向内环:四段弧箭头,顺时针 -->
  <path d="M377 78 A108 108 0 0 1 446 161" fill="none" stroke="#b07d33" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M446 199 A108 108 0 0 1 359 286" fill="none" stroke="#4f6b8a" stroke-width="2.4" marker-end="url(#ab)"/>
  <path d="M321 286 A108 108 0 0 1 234 199" fill="none" stroke="#4f6b8a" stroke-width="2.4" marker-end="url(#ab)"/>
  <path d="M234 161 A108 108 0 0 1 321 74" fill="none" stroke="#b07d33" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- 中心 -->
  <text x="340" y="176" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#a8453a" text-anchor="middle">反身正反馈</text>
  <text x="340" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#8a7a5e" text-anchor="middle">顺着转多顺，倒着转多险</text>

  <!-- 四节点 -->
  <g font-family="'Noto Serif SC',serif" text-anchor="middle">
    <rect x="272" y="50" width="136" height="44" rx="7" fill="#f6edda" stroke="#c8a96a" stroke-width="1.6"/>
    <text x="340" y="78" font-size="15" font-weight="700" fill="#8a6d2f">相 信</text>

    <rect x="386" y="157" width="156" height="46" rx="7" fill="#f6edda" stroke="#c8a96a" stroke-width="1.4"/>
    <text x="464" y="177" font-size="11.5" fill="#8a6d2f">股价抬高 · 融资更贱</text>
    <text x="464" y="194" font-size="11.5" fill="#8a6d2f">招人更阔 · 光环更亮</text>

    <rect x="272" y="266" width="136" height="46" rx="7" fill="#e8eef4" stroke="#4f6b8a" stroke-width="1.4"/>
    <text x="340" y="286" font-size="11.5" fill="#3f5570">客户拥上门</text>
    <text x="340" y="303" font-size="11.5" fill="#3f5570">业绩加速</text>

    <rect x="138" y="157" width="150" height="46" rx="7" fill="#e8eef4" stroke="#4f6b8a" stroke-width="1.4"/>
    <text x="213" y="184" font-size="11.5" fill="#3f5570">业绩回头给相信盖章</text>
  </g>

  <text x="340" y="344" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">虚线:相信一旦松口,同一台机器原样倒着转 —— 股价跌 → 资本贵 → 人才散 → 增长减速 → 从反面坐实怀疑</text>
</svg>
