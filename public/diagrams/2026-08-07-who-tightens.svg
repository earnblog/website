<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="示意图:市场利率沿着一整条曲线一路往上爬,借贷变贵、利率敏感资产一路在跌,收紧发生在整条曲线上;最右端一条竖虚线是九月议息,只在早已抬起的线上补一个章。">
  <rect width="680" height="360" fill="#fbf9f4"/>

  <text x="40" y="40" font-family="'Noto Serif SC',serif" font-size="14.5" font-weight="700" fill="#2b2b2b">收紧发生在整条曲线上,不在最后那一个点</text>

  <!-- 坐标轴 -->
  <line x1="88" y1="292" x2="628" y2="292" stroke="#ddd4c4" stroke-width="1.2"/>
  <text x="96" y="312" font-family="system-ui,sans-serif" font-size="10.5" fill="#9a927f">几个星期前</text>
  <text x="470" y="312" font-family="system-ui,sans-serif" font-size="10.5" fill="#9a927f">九月议息</text>

  <!-- 市场利率:一路爬升(市场自己在收紧) -->
  <path d="M100 250 C 200 232, 300 196, 400 162 C 460 142, 500 132, 540 128" fill="none" stroke="#4f6b8a" stroke-width="3"/>
  <!-- 议息点之后:美联储只是接上这根早已抬起的线,近乎平 -->
  <path d="M540 128 L604 126" fill="none" stroke="#4f6b8a" stroke-width="3" stroke-dasharray="2 3"/>
  <text x="150" y="214" font-family="system-ui,sans-serif" font-size="11" fill="#4f6b8a">市场利率(两年期国债)· 市场一分一分自己抬上去</text>

  <!-- 一路在跌:利率敏感资产,随折扣变大一路掉,不必等议息 -->
  <g stroke="#a8453a" stroke-width="1.4" fill="none">
    <path d="M230 236 L230 258" marker-end="url(#dn)"/>
    <path d="M320 214 L320 236" marker-end="url(#dn)"/>
    <path d="M410 186 L410 208" marker-end="url(#dn)"/>
  </g>
  <text x="238" y="272" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a">借贷变贵 · 公用事业、房托一路在跌</text>

  <!-- 九月议息:竖虚线 + 盖章 -->
  <line x1="540" y1="96" x2="540" y2="292" stroke="#b07d33" stroke-width="1.3" stroke-dasharray="6 5"/>
  <rect x="500" y="70" width="118" height="30" rx="4" fill="none" stroke="#b07d33" stroke-width="1.4"/>
  <text x="559" y="90" font-family="'Noto Serif SC',serif" font-size="12.5" font-weight="700" fill="#b07d33" text-anchor="middle">盖章 · 追认</text>
  <path d="M559 100 L559 120" stroke="#b07d33" stroke-width="1.3" fill="none" marker-end="url(#st)"/>

  <defs>
    <marker id="dn" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0 0 L8 0 L4 8 z" fill="#a8453a"/></marker>
    <marker id="st" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0 0 L8 0 L4 8 z" fill="#b07d33"/></marker>
  </defs>

  <line x1="40" y1="334" x2="640" y2="334" stroke="#e3ded2" stroke-width="1"/>
  <text x="40" y="352" font-family="system-ui,sans-serif" font-size="10.5" fill="#6b7280">机制示意 · 动手收紧的是整条上行的市场利率;九月那一下,只在早已抬起的线上补一个章</text>
</svg>
