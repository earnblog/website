<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:左半边一排金色小人站在横线对面接住筹码,右半边对面空空荡荡只剩一个红色问号,底部金字:流动性不是水,是对面的人">
  <rect width="680" height="300" fill="#181f2b"/>
  <rect x="340" y="0" width="340" height="300" fill="#1c2330"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">流动性不是水,是对面的人</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">平静时:对面站满了人 · 紧张时:对面一起转身</text>
  <line x1="48" y1="170" x2="632" y2="170" stroke="#4f6b8a" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#c8a96a">
    <circle cx="90" cy="112" r="7"/><rect x="83" y="121" width="14" height="26" rx="4"/>
    <circle cx="140" cy="112" r="7"/><rect x="133" y="121" width="14" height="26" rx="4"/>
    <circle cx="190" cy="112" r="7"/><rect x="183" y="121" width="14" height="26" rx="4"/>
    <circle cx="240" cy="112" r="7"/><rect x="233" y="121" width="14" height="26" rx="4"/>
    <circle cx="290" cy="112" r="7"/><rect x="283" y="121" width="14" height="26" rx="4"/>
  </g>
  <g fill="#fbf9f4">
    <circle cx="115" cy="200" r="6"/><circle cx="165" cy="200" r="6"/><circle cx="215" cy="200" r="6"/><circle cx="265" cy="200" r="6"/>
  </g>
  <g stroke="#c8a96a" stroke-width="1.5" fill="none">
    <path d="M115 192 L115 152"/><path d="M165 192 L165 152"/><path d="M215 192 L215 152"/><path d="M265 192 L265 152"/>
  </g>
  <text x="190" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a94a6">你递过去,有人接</text>
  <g fill="#fbf9f4">
    <circle cx="430" cy="200" r="6"/><circle cx="480" cy="200" r="6"/><circle cx="530" cy="200" r="6"/><circle cx="580" cy="200" r="6"/>
  </g>
  <text x="505" y="142" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="54" font-weight="700" fill="#a8453a">?</text>
  <text x="505" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a94a6">你递过去,对面没人</text>
  <text x="340" y="276" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#c8a96a">钱一直都在,站在对面的人不在了</text>
</svg>
