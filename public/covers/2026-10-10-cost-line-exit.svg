<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:金色虚线代表ETF持有人平均成本线,价格曲线站上虚线后又退回,线下红点是想回本离场的人,红字:成本线不是支撑,是出口">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">成本价不是一个数,是一排出口</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">比特币现货ETF · 平均成本线 · 回本即离场</text>
  <line x1="48" y1="150" x2="632" y2="150" stroke="#c8a96a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="632" y="142" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#c8a96a">平均成本线(估算)</text>
  <polyline points="48,220 130,205 210,185 290,160 360,128 430,118 500,140 560,152 632,168" fill="none" stroke="#4f6b8a" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#a8453a"><circle cx="540" cy="176" r="4"/><circle cx="562" cy="188" r="4"/><circle cx="584" cy="180" r="4"/><circle cx="606" cy="194" r="4"/><circle cx="574" cy="204" r="4"/></g>
  <text x="400" y="104" font-family="system-ui,sans-serif" font-size="11" fill="#fbf9f4">站上线 · 流入</text>
  <text x="540" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#fbf9f4">退回线脚 · 流出</text>
  <text x="340" y="268" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#a8453a">成本线不是支撑,是出口</text>
</svg>
