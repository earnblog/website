<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,一道金色的水位线横贯画面代表折现率;水位线左侧一艘锚绳很短的船纹丝不动标蓝筹股;水位线右侧一艘锚绳又长又松的船被明显抬起标杠杆资产,船头两支箭头分别指向比特币与以太坊">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">退潮的不是风险,是杠杆的价格</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-09-18 美东周五 · 10年期美债回落至4.9%附近 · 原油三连跌 · BTC ETF净流入 / ETH ETF净流出</text>

  <!-- water level line: the discount rate -->
  <line x1="48" y1="190" x2="632" y2="190" stroke="#c8a96a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="632" y="184" font-family="system-ui,sans-serif" font-size="10" fill="#c8a96a" text-anchor="end">折现率 · 水位线</text>

  <!-- baseline for boats -->
  <line x1="48" y1="248" x2="632" y2="248" stroke="#33404f" stroke-width="1"/>

  <!-- left boat: blue chip, short anchor, barely lifted -->
  <g>
    <path d="M 118 220 L 178 220 L 168 236 L 128 236 Z" fill="none" stroke="#4f6b8a" stroke-width="1.8"/>
    <line x1="148" y1="220" x2="148" y2="200" stroke="#4f6b8a" stroke-width="1.6"/>
    <line x1="148" y1="236" x2="148" y2="243" stroke="#4f6b8a" stroke-width="1.4" stroke-dasharray="2 2"/>
    <text x="148" y="266" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#a9bdd1" text-anchor="middle">蓝筹股</text>
    <text x="148" y="282" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">锚绳短 · 几乎不动</text>
  </g>

  <!-- right boat: leveraged assets, long loose anchor, lifted high -->
  <g>
    <path d="M 470 156 L 530 156 L 520 172 L 480 172 Z" fill="none" stroke="#c8a96a" stroke-width="2"/>
    <line x1="500" y1="156" x2="500" y2="132" stroke="#c8a96a" stroke-width="1.8"/>
    <path d="M 493 142 L 500 130 L 507 142" fill="none" stroke="#c8a96a" stroke-width="1.8"/>
    <line x1="500" y1="172" x2="500" y2="246" stroke="#a8453a" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="500" y="192" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">BTC</text>
    <text x="500" y="264" font-family="system-ui,sans-serif" font-size="9.5" fill="#a8453a" text-anchor="middle">ETH</text>
    <text x="500" y="288" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#e8d3ae" text-anchor="middle">杠杆资产</text>
  </g>
  <text x="500" y="302" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">锚绳长 · 明显被抬起</text>

  <text x="48" y="300" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">水位只抬升一次,起伏的幅度,是每条船自己的事</text>
</svg>
