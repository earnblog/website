<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:一块由许多小方块拼成的表决板,每块都亮着绿灯,板子中央盖着一枚红色印章验证通过,可印章的墨水管绕到板子背后,接在一节写着投资浮盈的电池上">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">证人也是被告,表决就成了自问自答</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-08-27 · 软件股集体暴涨 · 领头羊的证词是一笔投资浮盈</text>

  <!-- vote board: grid of small lit tiles -->
  <g>
    <rect x="90" y="96" width="360" height="130" rx="4" fill="#1c2330" stroke="#33404f" stroke-width="1.4"/>
    <!-- tiles 4x3 -->
    <g fill="#4f6b8a">
      <rect x="106" y="112" width="70" height="30" rx="2"/>
      <rect x="186" y="112" width="70" height="30" rx="2"/>
      <rect x="266" y="112" width="70" height="30" rx="2"/>
      <rect x="346" y="112" width="70" height="30" rx="2"/>
      <rect x="106" y="152" width="70" height="30" rx="2" fill="#c8a96a"/>
      <rect x="186" y="152" width="70" height="30" rx="2"/>
      <rect x="266" y="152" width="70" height="30" rx="2"/>
      <rect x="346" y="152" width="70" height="30" rx="2"/>
      <rect x="106" y="192" width="70" height="20" rx="2"/>
      <rect x="186" y="192" width="70" height="20" rx="2"/>
      <rect x="266" y="192" width="70" height="20" rx="2"/>
      <rect x="346" y="192" width="70" height="20" rx="2"/>
    </g>
    <text x="141" y="171" font-family="system-ui,sans-serif" font-size="8.5" fill="#181f2b" text-anchor="middle">Salesforce</text>
  </g>

  <!-- seal stamped over the board -->
  <circle cx="270" cy="160" r="46" fill="none" stroke="#a8453a" stroke-width="2.4" opacity="0.9"/>
  <text x="270" y="156" font-family="'Noto Serif SC',serif" font-size="12" font-weight="700" fill="#a8453a" text-anchor="middle">验证</text>
  <text x="270" y="172" font-family="'Noto Serif SC',serif" font-size="12" font-weight="700" fill="#a8453a" text-anchor="middle">通过</text>

  <!-- ink tube looping from seal to a hidden battery behind the Salesforce tile -->
  <path d="M 300 178 C 340 210, 130 230, 141 182" fill="none" stroke="#a8453a" stroke-width="1.6" stroke-dasharray="4,3"/>

  <!-- hidden battery -->
  <rect x="500" y="150" width="86" height="40" rx="4" fill="#1c2330" stroke="#c8a96a" stroke-width="1.4"/>
  <text x="543" y="167" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#c8a96a" text-anchor="middle">投资浮盈</text>
  <text x="543" y="181" font-family="system-ui,sans-serif" font-size="8.5" fill="#9fb2c6" text-anchor="middle">$2.6B</text>
  <path d="M 141 182 C 250 250, 420 250, 500 172" fill="none" stroke="#c8a96a" stroke-width="1.6" stroke-dasharray="4,3"/>

  <line x1="48" y1="264" x2="632" y2="264" stroke="#33404f" stroke-width="1"/>
  <text x="48" y="282" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">照亮整块表决板的电,来自其中一块方块自己身后的电源</text>
</svg>
