<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,一条代表产能的蓝色曲线爬升后逐渐贴近一道标着物理极限的红色虚线并走平;另一条代表营收的金色曲线毫不停顿地穿过虚线继续向右上方冲,两线之间被反复标注的缺口就是价格">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">涨的不是芯片,是价格</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-09-10 台积电8月营收同比+53.3% · 建厂速度4-5倍仍追不上</text>

  <!-- baseline -->
  <line x1="48" y1="240" x2="632" y2="240" stroke="#33404f" stroke-width="1"/>

  <!-- physical limit dashed line -->
  <line x1="48" y1="118" x2="632" y2="118" stroke="#a8453a" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="606" y="112" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#e0b3a8" text-anchor="end">产能的物理极限</text>

  <!-- capacity curve: rises then flattens near the red line -->
  <path d="M 70 232 C 160 214, 230 176, 300 140 C 360 118, 430 116, 600 114" fill="none" stroke="#4f6b8a" stroke-width="3"/>
  <text x="330" y="150" font-family="'Noto Serif SC',serif" font-size="11" fill="#a9bdd1">产能 · 爬坡后走平</text>

  <!-- revenue curve: rises past the limit line -->
  <path d="M 70 232 C 170 204, 260 150, 340 106 C 420 62, 520 40, 610 20" fill="none" stroke="#c8a96a" stroke-width="3.4"/>
  <text x="470" y="46" font-family="'Noto Serif SC',serif" font-size="11" fill="#e6d3a8">营收 · 越过极限继续冲</text>

  <!-- gap markers between the two curves -->
  <g stroke="#a8453a" stroke-width="1.6">
    <line x1="420" y1="88" x2="420" y2="116"/>
    <line x1="500" y1="58" x2="500" y2="115"/>
    <line x1="580" y1="30" x2="580" y2="114"/>
  </g>
  <text x="500" y="150" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">这道越拉越宽的缺口 = 价格</text>

  <!-- record point -->
  <circle cx="610" cy="20" r="4" fill="#c8a96a"/>
  <text x="632" y="264" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" text-anchor="end">同比+53.3% · 环比+10.1% · 史上最高月</text>

  <text x="48" y="290" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">产能先撞墙,价格才接班——这53.3%里,涨的从来不是芯片</text>
</svg>
