<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,一条金红色折线从左侧陡然爬升到右上角,标10年期美债收益率、2007年以来新高;另一条蓝色折线几乎贴着基线走平,标标普500、几乎原地踏步;两线之间越拉越大的缺口上标注同一天两本账">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">吓退资金的,不是利率,是没有增长垫底</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-09-24 美东周四 · 10年期美债破5.15%创2007年新高 · 道指仅跌0.3% · PMI冲上58.4</text>

  <!-- baseline -->
  <line x1="48" y1="248" x2="632" y2="248" stroke="#33404f" stroke-width="1"/>

  <!-- rising yield line -->
  <path d="M 70 214 L 200 206 L 320 178 L 440 130 L 560 90 L 616 74" fill="none" stroke="#a8453a" stroke-width="2.2"/>
  <circle cx="616" cy="74" r="3.5" fill="#a8453a"/>
  <text x="616" y="60" font-family="system-ui,sans-serif" font-size="10" fill="#a8453a" text-anchor="end">10年期美债收益率 · 2007年以来新高</text>

  <!-- flat index line -->
  <path d="M 70 222 L 200 220 L 320 224 L 440 219 L 560 222 L 616 220" fill="none" stroke="#4f6b8a" stroke-width="2.2"/>
  <circle cx="616" cy="220" r="3.5" fill="#4f6b8a"/>
  <text x="616" y="236" font-family="system-ui,sans-serif" font-size="10" fill="#8fa8c2" text-anchor="end">标普500 · 几乎原地踏步</text>

  <!-- widening gap marker -->
  <line x1="440" y1="130" x2="440" y2="219" stroke="#c8a96a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="560" y1="90" x2="560" y2="222" stroke="#c8a96a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="500" y="105" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#c8a96a" text-anchor="middle">同一天,两本账</text>

  <text x="48" y="300" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">利率涨得再凶,补不上的从来不是信心,是没被利率追上的那道增长斜率</text>
</svg>
