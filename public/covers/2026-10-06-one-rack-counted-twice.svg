<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,一台金色机柜居中,左右两条线分别连到富士康出货和英伟达出货,同一台机柜数了两遍">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">出货不是需求,回声不是证据</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">富士康 · 英伟达 · 同一条供应链</text>
  <rect x="300" y="100" width="80" height="110" rx="4" fill="#c8a96a"/>
  <g stroke="#181f2b" stroke-width="2"><line x1="308" y1="128" x2="372" y2="128"/><line x1="308" y1="152" x2="372" y2="152"/><line x1="308" y1="176" x2="372" y2="176"/></g>
  <line x1="296" y1="155" x2="190" y2="155" stroke="#4f6b8a" stroke-width="2"/>
  <line x1="384" y1="155" x2="490" y2="155" stroke="#4f6b8a" stroke-width="2"/>
  <rect x="82" y="138" width="108" height="34" rx="3" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <rect x="490" y="138" width="108" height="34" rx="3" fill="none" stroke="#4f6b8a" stroke-width="1.5"/>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#fbf9f4" text-anchor="middle">
    <text x="136" y="160">富士康·出货</text>
    <text x="544" y="160">英伟达·出货</text>
  </g>
  <text x="340" y="254" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#a8453a">同一台机柜,数了两遍</text>
</svg>
