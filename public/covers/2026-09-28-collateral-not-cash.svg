<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,左侧一枚金色支票图形写现金流回购、2350亿美元,稳稳托住一条几乎不动的价格线;右侧一枚红色抵押凭证图形写股价抵押贷款、250亿美元,压在一条陡然下坠的价格线上">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">杠杆抵押的是现金流,还是价格本身!</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-09-28 美东周一 · 英伟达回购加码至2350亿美元 · Arm跌穿8%</text>

  <!-- divider -->
  <line x1="340" y1="86" x2="340" y2="266" stroke="#33404f" stroke-width="1"/>

  <!-- left: check icon, cash-flow backed, price flat -->
  <rect x="76" y="98" width="104" height="66" rx="6" fill="none" stroke="#c8a96a" stroke-width="1.8"/>
  <line x1="90" y1="118" x2="166" y2="118" stroke="#c8a96a" stroke-width="1.4"/>
  <line x1="90" y1="132" x2="150" y2="132" stroke="#c8a96a" stroke-width="1.4"/>
  <text x="128" y="152" font-family="'Noto Serif SC',serif" font-size="11" fill="#c8a96a" text-anchor="middle">现金流回购</text>
  <text x="128" y="180" font-family="system-ui,sans-serif" font-size="10.5" fill="#e8e2d3" text-anchor="middle">2350亿美元</text>

  <line x1="60" y1="240" x2="300" y2="240" stroke="#33404f" stroke-width="1"/>
  <path d="M 60 222 L 130 220 L 200 224 L 260 219 L 300 221" fill="none" stroke="#4f6b8a" stroke-width="2.2"/>
  <circle cx="300" cy="221" r="3.5" fill="#4f6b8a"/>
  <text x="180" y="262" font-family="system-ui,sans-serif" font-size="10" fill="#8fa8c2" text-anchor="middle">英伟达 · 逆势涨约2%</text>

  <!-- right: pledge icon, price backed, price falling -->
  <rect x="500" y="98" width="104" height="66" rx="6" fill="none" stroke="#a8453a" stroke-width="1.8"/>
  <line x1="514" y1="118" x2="590" y2="118" stroke="#a8453a" stroke-width="1.4"/>
  <line x1="514" y1="132" x2="574" y2="132" stroke="#a8453a" stroke-width="1.4"/>
  <text x="552" y="152" font-family="'Noto Serif SC',serif" font-size="11" fill="#a8453a" text-anchor="middle">股价抵押贷款</text>
  <text x="552" y="180" font-family="system-ui,sans-serif" font-size="10.5" fill="#e8e2d3" text-anchor="middle">250亿美元</text>

  <line x1="380" y1="200" x2="620" y2="200" stroke="#33404f" stroke-width="1"/>
  <path d="M 380 182 L 440 190 L 500 210 L 560 236 L 620 250" fill="none" stroke="#a8453a" stroke-width="2.2"/>
  <circle cx="620" cy="250" r="3.5" fill="#a8453a"/>
  <text x="500" y="272" font-family="system-ui,sans-serif" font-size="10" fill="#c9877e" text-anchor="middle">Arm · 跌穿8%</text>

  <text x="48" y="292" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">涨的时候看不出区别,跌的时候才现出原形</text>
</svg>
