<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:补涨的那一头是下跌的那一头照出来的影子">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="50" font-family="'Noto Serif SC',serif" font-size="17" font-weight="700" fill="#c8a96a">补涨的那一头,是下跌照出来的影子</text>

  <!-- 镜面 / 水面 -->
  <line x1="48" y1="168" x2="632" y2="168" stroke="#3a4658" stroke-width="1.4" stroke-dasharray="5 5"/>
  <text x="632" y="163" font-family="system-ui,sans-serif" font-size="10.5" fill="#7f8ba0" text-anchor="end">同一个水面 · 同一笔钱</text>

  <!-- 左:下沉的科技(实体) -->
  <text x="150" y="88" font-family="system-ui,sans-serif" font-size="11" fill="#a8453a" text-anchor="middle">科技 · 拥挤交易(在跌)</text>
  <rect x="120" y="100" width="60" height="66" fill="#a8453a" opacity="0.92"/>
  <path d="M150 176 L138 158 L162 158 Z" fill="#a8453a"/>
  <text x="150" y="196" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#a8453a" text-anchor="middle">↓ 光源</text>

  <!-- 右:抬头的补涨板块(倒影) -->
  <text x="510" y="88" font-family="system-ui,sans-serif" font-size="11" fill="#4f6b8a" text-anchor="middle">房地产 · 金融(在涨)</text>
  <rect x="480" y="100" width="60" height="66" fill="#4f6b8a" opacity="0.42"/>
  <path d="M510 92 L498 110 L522 110 Z" fill="#4f6b8a" opacity="0.7"/>
  <text x="510" y="196" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4f6b8a" text-anchor="middle">↑ 影子</text>

  <!-- 反照连线 -->
  <path d="M180 133 C300 133 360 133 480 133" fill="none" stroke="#b07d33" stroke-width="1.3" stroke-dasharray="3 4"/>
  <path d="M474 129 L482 133 L474 137" fill="#b07d33"/>
  <text x="330" y="126" font-family="system-ui,sans-serif" font-size="10.5" fill="#b07d33" text-anchor="middle">同一笔被吓跑的钱,落到反面</text>

  <!-- 底部注 -->
  <line x1="48" y1="230" x2="632" y2="230" stroke="#2a3342" stroke-width="1"/>
  <text x="48" y="256" font-family="system-ui,sans-serif" font-size="11" fill="#7f8ba0">7/24 收盘:纳指跌 · 科技板块 −2.37% · 领涨换成房地产与金融</text>
  <text x="48" y="278" font-family="system-ui,sans-serif" font-size="11.5" fill="#c8a96a">看着像两个方向,其实只有一个——影子不是第二束光。</text>
</svg>
