  <path d="M580 140 H 465 V 160" stroke="#4f6b8a" stroke-width="6" fill="none"/>
  <circle cx="465" cy="150" r="9" fill="#a8453a"/>
  <text x="440" y="128" text-anchor="end" font-family="'Noto Serif SC',serif" font-size="13" fill="#a8453a">出资人换了</text>
</svg>
