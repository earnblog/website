  <rect x="420" y="160" width="90" height="100" rx="3" fill="#33404f" stroke="#8a94a6" stroke-width="1"/>
  <g stroke="#8a94a6" stroke-width="1"><line x1="430" y1="180" x2="500" y2="180"/><line x1="430" y1="200" x2="500" y2="200"/><line x1="430" y1="220" x2="500" y2="220"/><line x1="430" y1="240" x2="500" y2="240"/></g>
  <text x="465" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a94a6">AI资本开支</text>
  <rect x="580" y="96" width="56" height="70" rx="3" fill="#4f6b8a"/>
  <path d="M580 104 L608 84 L636 104 Z" fill="#4f6b8a"/>
