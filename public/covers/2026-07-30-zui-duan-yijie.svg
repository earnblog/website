<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:美联储按住的,不是经济真正付的那个利率">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="50" font-family="'Noto Serif SC',serif" font-size="16.5" font-weight="700" fill="#c8a96a">按得住今晚的利率,按不住三十年的价格</text>

  <!-- 2007 高点虚线 -->
  <line x1="60" y1="96" x2="620" y2="96" stroke="#a8453a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="620" y="91" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="end">2007 年以来最高 · 长钱最贵</text>

  <!-- 曲线:短端被摁平,长端窜上去 -->
  <path d="M96 214 C 200 210, 300 206, 380 196 C 470 184, 540 130, 616 88" fill="none" stroke="#4f6b8a" stroke-width="2.4"/>
  <path d="M470 184 C 540 130, 580 108, 616 88" fill="none" stroke="#a8453a" stroke-width="2.8"/>

  <!-- 短端:美联储的手摁住 -->
  <circle cx="96" cy="214" r="5.5" fill="#4f6b8a"/>
  <rect x="66" y="228" width="120" height="20" rx="2" fill="#22303f" stroke="#4f6b8a" stroke-width="1.2"/>
  <text x="126" y="242" font-family="system-ui,sans-serif" font-size="10.5" fill="#7fa0c2" text-anchor="middle">美联储摁得住这头</text>
  <line x1="96" y1="214" x2="96" y2="226" stroke="#4f6b8a" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 长端:窜上去,够不着 -->
  <circle cx="616" cy="88" r="6" fill="#a8453a"/>
  <rect x="486" y="228" width="140" height="20" rx="2" fill="#2a1e1c" stroke="#a8453a" stroke-width="1.2"/>
  <text x="556" y="242" font-family="system-ui,sans-serif" font-size="10.5" fill="#c56a5c" text-anchor="middle">长端自己窜了上去</text>
  <line x1="616" y1="88" x2="616" y2="226" stroke="#a8453a" stroke-width="1.1" stroke-dasharray="3 3"/>

  <!-- 轴标签 -->
  <text x="96" y="270" font-family="system-ui,sans-serif" font-size="10" fill="#5f6b80" text-anchor="middle">隔夜</text>
  <text x="356" y="270" font-family="system-ui,sans-serif" font-size="10" fill="#5f6b80" text-anchor="middle">期限 →</text>
  <text x="616" y="270" font-family="system-ui,sans-serif" font-size="10" fill="#5f6b80" text-anchor="middle">三十年</text>

  <line x1="48" y1="284" x2="632" y2="284" stroke="#2a3342" stroke-width="1"/>
</svg>
