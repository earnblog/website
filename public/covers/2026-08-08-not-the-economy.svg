<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:就业这条线往下走,股市那条金线却冲上新高,两条线朝相反方向叉开——市场欢呼的不是经济,是收紧的手松了一格">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="46" font-family="'Noto Serif SC',serif" font-size="16.5" font-weight="700" fill="#c8a96a">经济这条线往下,股市那条线往上——叉开的那道口,不是矛盾,是答案</text>

  <line x1="88" y1="244" x2="628" y2="244" stroke="#3a4556" stroke-width="1.2"/>

  <!-- 就业/经济:红线,走弱下行 -->
  <path d="M104 150 C 220 168, 340 196, 520 224" fill="none" stroke="#a8453a" stroke-width="2.4"/>
  <circle cx="520" cy="224" r="4" fill="#a8453a"/>
  <text x="360" y="216" font-family="system-ui,sans-serif" font-size="11" fill="#c06a5e">就业 · 七月不增反减,经济在走弱</text>

  <!-- 股市:金线,一路冲上新高 -->
  <path d="M104 190 C 240 176, 360 138, 470 108 C 520 94, 552 88, 576 84" fill="none" stroke="#c8a96a" stroke-width="3"/>
  <circle cx="576" cy="84" r="5" fill="#c8a96a"/>
  <text x="300" y="128" font-family="system-ui,sans-serif" font-size="11" fill="#c8a96a">股市 · 收出纪录新高,一周最猛</text>
  <text x="588" y="80" font-family="system-ui,sans-serif" font-size="10.5" fill="#c8a96a" text-anchor="end">新高</text>

  <!-- 叉开处标注 -->
  <line x1="520" y1="224" x2="520" y2="96" stroke="#4f6b8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="512" y="262" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6" text-anchor="end">同一份报告,两个方向</text>

  <text x="356" y="284" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6" text-anchor="middle">市场眼里没有那些消失的岗位,只有它们替它换来的、一格松开的银根</text>
</svg>
