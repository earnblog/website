<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:金色横线代表持平的指数,线下方一根蓝色向上箭头和一根红色向下箭头方向相反,被压成一条平线,红字:持平不是平静,是抵消">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">持平不是平静,是抵消</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">标普500 -0.06% · 存储股 -3.9% · 平均数藏起撕裂</text>
  <line x1="48" y1="150" x2="632" y2="150" stroke="#c8a96a" stroke-width="2"/>
  <text x="632" y="140" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#c8a96a">指数:几乎一条平线</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="340" y1="150" x2="340" y2="96" stroke="#4f6b8a"/>
    <line x1="340" y1="150" x2="340" y2="204" stroke="#a8453a"/>
  </g>
  <polygon points="340,86 331,102 349,102" fill="#4f6b8a"/>
  <polygon points="340,214 331,198 349,198" fill="#a8453a"/>
  <text x="360" y="104" font-family="system-ui,sans-serif" font-size="11" fill="#fbf9f4">上涨的一半</text>
  <text x="360" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#fbf9f4">下跌的一半</text>
  <text x="340" y="268" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#a8453a">线是平的,线下面不平</text>
</svg>
