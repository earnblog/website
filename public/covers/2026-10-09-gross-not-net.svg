<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:同一堆金色硬币被两把尺子量出两个高度,毛额约700亿,净额约500亿,红字:少的不是钱,是量法">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">收入不是一个数,是一把尺子</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">OpenAI年化收入 · 毛额 vs 净额 · 口径</text>
  <g fill="#c8a96a"><rect x="290" y="150" width="100" height="14" rx="2"/><rect x="290" y="168" width="100" height="14" rx="2"/><rect x="290" y="186" width="100" height="14" rx="2"/><rect x="290" y="204" width="100" height="14" rx="2"/></g>
  <g stroke="#4f6b8a" stroke-width="2"><line x1="190" y1="104" x2="190" y2="222"/><line x1="490" y1="132" x2="490" y2="222"/></g>
  <g stroke="#4f6b8a" stroke-width="1.5"><line x1="182" y1="104" x2="198" y2="104"/><line x1="482" y1="132" x2="498" y2="132"/></g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#fbf9f4"><text x="176" y="100" text-anchor="end">毛额·约700亿</text><text x="504" y="128">净额·约500亿</text></g>
  <text x="340" y="268" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#a8453a">少的不是钱,是量法</text>
</svg>
