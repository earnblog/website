<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:一只金色的手只够得着温度计下半截的蓝色核心,上半截红色能源在够不着的地方,一条红色虚线从上半截绕回下半截;金字:核心不是真相,是够得着的那一半">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">核心不是真相,是够得着的那一半</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">八月CPI 整体3.4% · 核心2.4% · 中间那一截是能源</text>
  <rect x="300" y="86" width="44" height="170" rx="22" fill="#1c2330" stroke="#8a94a6" stroke-width="1.5"/>
  <rect x="308" y="96" width="28" height="70" rx="12" fill="#a8453a"/>
  <rect x="308" y="170" width="28" height="78" rx="12" fill="#4f6b8a"/>
  <text x="356" y="134" font-family="system-ui,sans-serif" font-size="12" fill="#fbf9f4">能源:够不着</text>
  <text x="356" y="214" font-family="system-ui,sans-serif" font-size="12" fill="#fbf9f4">核心:够得着</text>
  <path d="M120 230 C 180 230, 230 214, 296 210" fill="none" stroke="#c8a96a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="296" cy="210" r="8" fill="#c8a96a"/>
  <text x="120" y="252" font-family="system-ui,sans-serif" font-size="11" fill="#c8a96a">利率的手臂</text>
  <path d="M344 120 C 470 110, 500 250, 344 236" fill="none" stroke="#a8453a" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="344,236 356,229 356,243" fill="#a8453a"/>
  <text x="488" y="182" font-family="system-ui,sans-serif" font-size="11" fill="#a8453a">预期 · 工资 · 运价</text>
  <text x="340" y="284" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#a8453a">剔掉的那一半,会自己绕回来</text>
