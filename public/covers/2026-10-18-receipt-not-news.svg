<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:一张金色收据从左侧打出,写着+68.7%;上方一条蓝色价格线早早爬高,在收据打出时转头向下变红;红字:财报不是新闻,是收据">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">财报不是新闻,是收据</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">净利润同比 +68.7% · 财报后连跌两天 · 价格早已付款</text>
  <polyline points="48,200 140,184 230,150 320,108 400,92" fill="none" stroke="#4f6b8a" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="400,92 470,104 540,124 632,140" fill="none" stroke="#a8453a" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="400" cy="92" r="5" fill="#c8a96a"/>
  <text x="400" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c8a96a">预付款付清</text>
  <line x1="470" y1="104" x2="470" y2="196" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M420 196 h120 v64 l-10 -6 l-10 6 l-10 -6 l-10 6 l-10 -6 l-10 6 l-10 -6 l-10 6 l-10 -6 l-10 6 l-10 -6 l-10 6 z" fill="#c8a96a"/>
  <text x="480" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#181f2b">财报 · 已付讫</text>
  <text x="480" y="242" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#181f2b">+68.7%</text>
  <text x="48" y="270" font-family="'Noto Serif SC',serif" font-size="13" fill="#a8453a">价格不为同一批货付两次钱</text>
</svg>
