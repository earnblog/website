<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,五根金色柱子从左到右逐根变矮,代表每日净流入;一条蓝色折线在柱顶之上持续爬升,代表累计流入;缺口标注位置在涨,速度在死">
