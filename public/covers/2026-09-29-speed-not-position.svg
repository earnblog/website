  <rect x="290" y="221" width="56" height="35" fill="#c8a96a"/>
  <rect x="390" y="237" width="56" height="19" fill="#c8a96a"/>
  <rect x="490" y="243" width="56" height="13" fill="#c8a96a"/>
  <path d="M 118 130 L 218 104 L 318 92 L 418 86 L 518 83" fill="none" stroke="#4f6b8a" stroke-width="2.4"/>
  <circle cx="518" cy="83" r="3.5" fill="#4f6b8a"/>
