<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:一根金色弹簧被信号红的手压紧,上方分出向上的蓝色箭头和向下的红色箭头;底部金字:看跌期权不是温度计,是弹簧">
  <rect width="680" height="300" fill="#181f2b"/>
  <rect x="0" y="236" width="680" height="64" fill="#1c2330"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">每一份保险背后,都压着一笔要拆的对冲</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">恐惧落空 · 往上弹   恐惧兑现 · 往下弹</text>
  <!-- broken thermometer, faded -->
  <g opacity="0.35">
    <rect x="96" y="100" width="16" height="96" rx="8" fill="none" stroke="#8a94a6" stroke-width="2"/>
    <circle cx="104" cy="206" r="13" fill="none" stroke="#8a94a6" stroke-width="2"/>
    <line x1="80" y1="96" x2="128" y2="214" stroke="#a8453a" stroke-width="2.5"/>
  </g>
  <text x="104" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8a94a6">不是温度计</text>
  <!-- base -->
  <rect x="270" y="206" width="140" height="8" rx="2" fill="#4f6b8a"/>
  <!-- spring -->
  <path d="M340 206 l-30 -7 l60 -7 l-60 -7 l60 -7 l-60 -7 l60 -7 l-60 -7 l30 -7" fill="none" stroke="#c8a96a" stroke-width="4" stroke-linejoin="round"/>
  <!-- pressing hand / plate -->
  <rect x="290" y="142" width="100" height="10" rx="3" fill="#a8453a"/>
  <path d="M330 142 v-24 h20 v24" fill="#a8453a"/>
  <!-- arrows -->
  <path d="M410 150 C 450 130, 480 110, 520 92" fill="none" stroke="#4f6b8a" stroke-width="4"/>
  <path d="M520 92 l-16 0 l8 12 z" fill="#4f6b8a" transform="rotate(-25 520 92)"/>
  <text x="530" y="90" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#8fb0d4">落空:对冲被拆,变买盘</text>
  <path d="M410 180 C 450 190, 480 200, 520 214" fill="none" stroke="#a8453a" stroke-width="4"/>
  <path d="M520 214 l-14 -8 l-2 14 z" fill="#a8453a"/>
  <text x="530" y="218" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#d27a6e">兑现:对冲加码,变卖盘</text>
  <text x="340" y="274" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#c8a96a">看跌期权不是恐慌的温度计,是一根弹簧</text>
</svg>
