<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:担保没有消灭风险,只是把它从买家搬到卖家自己身上">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="50" font-family="'Noto Serif SC',serif" font-size="17" font-weight="700" fill="#c8a96a">担保没有消灭风险,只是换了个人扛</text>

  <!-- 左:买家 -->
  <rect x="60" y="96" width="132" height="72" rx="3" fill="#1c2330" stroke="#4f6b8a" stroke-width="1.4"/>
  <text x="126" y="126" font-family="system-ui,sans-serif" font-size="12" fill="#8fa6bf" text-anchor="middle">买家</text>
  <text x="126" y="146" font-family="system-ui,sans-serif" font-size="11" fill="#5f6f85" text-anchor="middle">信用不够 · 签不下租约</text>
  <text x="126" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#4f6b8a" text-anchor="middle">风险从这里被搬走</text>

  <!-- 中:那张纸 -->
  <rect x="300" y="104" width="80" height="56" rx="2" fill="#c8a96a" opacity="0.14" stroke="#c8a96a" stroke-width="1.2"/>
  <text x="340" y="130" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#c8a96a" text-anchor="middle">一张担保</text>
  <text x="340" y="150" font-family="system-ui,sans-serif" font-size="10" fill="#9a8a68" text-anchor="middle">不花现金 · 不进利润表</text>

  <!-- 风险搬运箭头 -->
  <path d="M196 132 C240 132 262 132 296 132" fill="none" stroke="#a8453a" stroke-width="1.6" stroke-dasharray="3 4"/>
  <path d="M290 128 L298 132 L290 136" fill="#a8453a"/>
  <path d="M384 132 C428 132 452 132 486 132" fill="none" stroke="#a8453a" stroke-width="1.6" stroke-dasharray="3 4"/>
  <path d="M480 128 L488 132 L480 136" fill="#a8453a"/>
  <text x="340" y="92" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">风险一路向右</text>

  <!-- 右:卖家 -->
  <rect x="490" y="96" width="132" height="72" rx="3" fill="#1c2330" stroke="#a8453a" stroke-width="1.6"/>
  <text x="556" y="126" font-family="system-ui,sans-serif" font-size="12" fill="#c9776c" text-anchor="middle">卖家</text>
  <text x="556" y="146" font-family="system-ui,sans-serif" font-size="11" fill="#8a5b54" text-anchor="middle">订单成立 · 风险留下</text>
  <text x="556" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#a8453a" text-anchor="middle">风险停在签字的人身上</text>

  <!-- 订单回流 -->
  <path d="M556 200 C556 218 420 218 340 218 C260 218 126 218 126 200" fill="none" stroke="#b07d33" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="340" y="234" font-family="system-ui,sans-serif" font-size="10.5" fill="#b07d33" text-anchor="middle">订单当天就回到卖家自己的利润表上</text>

  <!-- 底部注 -->
  <line x1="48" y1="252" x2="632" y2="252" stroke="#2a3342" stroke-width="1"/>
  <text x="48" y="276" font-family="system-ui,sans-serif" font-size="11.5" fill="#c8a96a">担保签下的从来不是买家的信用,是卖家自己的订单。</text>
</svg>
