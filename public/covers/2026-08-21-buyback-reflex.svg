<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:一只手按下写着回购20亿翻倍到40亿的按钮,连着一整张美债定价网络,网络中心标着欠债40万亿美元,一条利率曲线先凹下去随即弹回原位">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">摁下去的不是利率,是借来的一天时间</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-08-20 · 回购20亿→40亿 · 三十年期利率-9bp后+5.4bp</text>

  <!-- 按钮 -->
  <rect x="70" y="120" width="92" height="60" rx="8" fill="#22304a" stroke="#c8a96a" stroke-width="1.4"/>
  <circle cx="116" cy="142" r="14" fill="#c8a96a"/>
  <text x="116" y="147" font-family="system-ui,sans-serif" font-size="12" fill="#181f2b" text-anchor="middle" font-weight="700">▼</text>
  <text x="116" y="171" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#e7d9b8" text-anchor="middle">回购操作</text>
  <text x="116" y="198" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">20亿 → 40亿美元</text>

  <!-- 连线到网络 -->
  <line x1="162" y1="150" x2="230" y2="150" stroke="#c8a96a" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- 网络:密密麻麻小点 -->
  <g fill="#4f6b8a">
    <circle cx="250" cy="120" r="3"/><circle cx="278" cy="108" r="3"/><circle cx="304" cy="128" r="3"/>
    <circle cx="330" cy="105" r="3"/><circle cx="356" cy="122" r="3"/><circle cx="240" cy="150" r="3"/>
    <circle cx="268" cy="145" r="3"/><circle cx="296" cy="160" r="3"/><circle cx="322" cy="142" r="3"/>
    <circle cx="348" cy="155" r="3"/><circle cx="256" cy="180" r="3"/><circle cx="284" cy="192" r="3"/>
    <circle cx="312" cy="178" r="3"/><circle cx="338" cy="188" r="3"/><circle cx="362" cy="170" r="3"/>
    <circle cx="230" cy="112" r="3"/><circle cx="374" cy="140" r="3"/><circle cx="220" cy="170" r="3"/>
  </g>
  <g stroke="#33404f" stroke-width="0.8">
    <line x1="250" y1="120" x2="278" y2="108"/><line x1="278" y1="108" x2="304" y2="128"/>
    <line x1="304" y1="128" x2="330" y2="105"/><line x1="330" y1="105" x2="356" y2="122"/>
    <line x1="240" y1="150" x2="268" y2="145"/><line x1="268" y1="145" x2="296" y2="160"/>
    <line x1="296" y1="160" x2="322" y2="142"/><line x1="322" y1="142" x2="348" y2="155"/>
    <line x1="256" y1="180" x2="284" y2="192"/><line x1="284" y1="192" x2="312" y2="178"/>
    <line x1="312" y1="178" x2="338" y2="188"/><line x1="230" y1="112" x2="250" y2="120"/>
    <line x1="220" y1="170" x2="256" y2="180"/><line x1="356" y1="122" x2="374" y2="140"/>
    <line x1="304" y1="128" x2="296" y2="160"/><line x1="330" y1="105" x2="322" y2="142"/>
  </g>
  <text x="298" y="215" font-family="'Noto Serif SC',serif" font-size="11" fill="#9fb2c6" text-anchor="middle">美债定价网络</text>
  <text x="298" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#7f97ae" text-anchor="middle">欠债规模:40万亿美元</text>

  <!-- 利率曲线:凹下去再弹回 -->
  <path d="M 420 150 C 450 150, 460 190, 490 190 S 530 150, 560 128 S 600 150, 620 150" fill="none" stroke="#a8453a" stroke-width="2.4"/>
  <circle cx="490" cy="190" r="3.5" fill="#a8453a"/>
  <circle cx="560" cy="128" r="3.5" fill="#c8a96a"/>
  <text x="470" y="212" font-family="system-ui,sans-serif" font-size="9.5" fill="#c07a70" text-anchor="middle">公告日 -9bp</text>
  <text x="576" y="118" font-family="system-ui,sans-serif" font-size="9.5" fill="#e7d9b8" text-anchor="middle">次日 +5.4bp</text>
  <text x="520" y="245" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#8a94a6" text-anchor="middle">三十年期利率</text>

  <line x1="48" y1="272" x2="632" y2="272" stroke="#33404f" stroke-width="1"/>
  <text x="48" y="290" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">按钮只有一个,网络的节点数不清</text>
</svg>
