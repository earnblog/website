<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:深墨底色上,一道金色的利率箭头自下而上顶起画面;三个节点并排,攥着现金的被抬高,欠着钱的被压低,手里攥着一摞欠条的银行被压得最深、标成红色">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">银行赚的不是利率,是还得起的那部分</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-09-16 美东周三 · 三年来首次加息 3.75%–4% · 道指 −1.21% · 纳指 −0.01%</text>

  <!-- baseline -->
  <line x1="48" y1="232" x2="632" y2="232" stroke="#33404f" stroke-width="1"/>

  <!-- the rate: one gold arrow rising from the bottom -->
  <path d="M 88 256 L 88 96" stroke="#c8a96a" stroke-width="2.6"/>
  <path d="M 79 108 L 88 94 L 97 108" fill="none" stroke="#c8a96a" stroke-width="2.6"/>
  <text x="88" y="272" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#c8a96a" text-anchor="middle">利率</text>
  <text x="88" y="286" font-family="system-ui,sans-serif" font-size="9.5" fill="#8a94a6" text-anchor="middle">整张网络的价格</text>

  <!-- node 1: holds cash, lifted -->
  <rect x="164" y="128" width="128" height="56" rx="3" fill="none" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="228" y="152" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#a9bdd1" text-anchor="middle">攥着钱的</text>
  <text x="228" y="171" font-family="system-ui,sans-serif" font-size="10" fill="#8a94a6" text-anchor="middle">利率涨 = 收入</text>
  <path d="M 228 124 L 228 106" stroke="#4f6b8a" stroke-width="2.2"/>
  <path d="M 221 113 L 228 104 L 235 113" fill="none" stroke="#4f6b8a" stroke-width="2.2"/>

  <!-- node 2: owes money, pressed -->
  <rect x="330" y="150" width="128" height="56" rx="3" fill="none" stroke="#8a94a6" stroke-width="1.6"/>
  <text x="394" y="174" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#c9d1dc" text-anchor="middle">欠着钱的</text>
  <text x="394" y="193" font-family="system-ui,sans-serif" font-size="10" fill="#8a94a6" text-anchor="middle">利率涨 = 账单</text>
  <path d="M 394 210 L 394 226" stroke="#8a94a6" stroke-width="2.2"/>
  <path d="M 387 219 L 394 228 L 401 219" fill="none" stroke="#8a94a6" stroke-width="2.2"/>

  <!-- node 3: holds IOUs (banks), pressed hardest -->
  <rect x="496" y="168" width="128" height="56" rx="3" fill="none" stroke="#a8453a" stroke-width="1.8"/>
  <text x="560" y="192" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#e0b3a8" text-anchor="middle">拿着欠条的 · 银行</text>
  <text x="560" y="211" font-family="system-ui,sans-serif" font-size="10" fill="#8a94a6" text-anchor="middle">利率涨 = 别人账单的成色</text>
  <path d="M 560 228 L 560 250" stroke="#a8453a" stroke-width="2.4"/>
  <path d="M 553 242 L 560 252 L 567 242" fill="none" stroke="#a8453a" stroke-width="2.4"/>
  <!-- a small stack of IOUs -->
  <g fill="none" stroke="#a8453a" stroke-width="1">
    <rect x="606" y="140" width="14" height="18" rx="1"/>
    <rect x="610" y="136" width="14" height="18" rx="1"/>
    <rect x="614" y="132" width="14" height="18" rx="1"/>
  </g>

  <text x="48" y="290" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">利率不替任何一个节点打工——它只把整片海的水位一起抬起来</text>
  <text x="632" y="290" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" text-anchor="end">高盛领跌 · 银行板块二月底以来最差一天 · 英特尔 +4%</text>
</svg>
