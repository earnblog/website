<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:一排金色服务器机柜立在跷跷板一端,另一端压着信号红的利率砝码,支点是一张蓝色合同;底部金字:卖的是算力,赚的是利差">
  <rect width="680" height="300" fill="#181f2b"/>
  <rect x="0" y="236" width="680" height="64" fill="#1c2330"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">合同锁住租金,利率决定成本</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">compute is a spread business</text>
  <!-- seesaw plank -->
  <g transform="rotate(-6 340 190)">
    <rect x="110" y="182" width="460" height="10" rx="3" fill="#33404f"/>
    <!-- server racks -->
    <g fill="#c8a96a">
      <rect x="130" y="112" width="34" height="70" rx="2"/>
      <rect x="170" y="112" width="34" height="70" rx="2"/>
      <rect x="210" y="112" width="34" height="70" rx="2"/>
    </g>
    <g stroke="#181f2b" stroke-width="2">
      <line x1="136" y1="128" x2="158" y2="128"/><line x1="136" y1="144" x2="158" y2="144"/><line x1="136" y1="160" x2="158" y2="160"/>
      <line x1="176" y1="128" x2="198" y2="128"/><line x1="176" y1="144" x2="198" y2="144"/><line x1="176" y1="160" x2="198" y2="160"/>
      <line x1="216" y1="128" x2="238" y2="128"/><line x1="216" y1="144" x2="238" y2="144"/><line x1="216" y1="160" x2="238" y2="160"/>
    </g>
    <!-- weight -->
    <path d="M470 182 L486 132 H546 L562 182 Z" fill="#a8453a"/>
    <circle cx="516" cy="124" r="9" fill="none" stroke="#a8453a" stroke-width="4"/>
    <text x="516" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" font-weight="700" fill="#fbf9f4">利率</text>
  </g>
  <!-- fulcrum contract -->
  <path d="M300 236 L340 196 L380 236 Z" fill="#4f6b8a"/>
  <text x="340" y="228" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#fbf9f4">合同</text>
  <text x="340" y="276" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="20" font-weight="700" fill="#c8a96a">卖的是算力,赚的是利差。</text>
</svg>
