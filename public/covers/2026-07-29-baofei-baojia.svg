<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:加息概率不是市场的预测,是保险的报价">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="50" font-family="'Noto Serif SC',serif" font-size="16.5" font-weight="700" fill="#c8a96a">它不在赌美联储,它在给恐惧报价</text>

  <!-- 左:被当成预测的那个数字 -->
  <text x="60" y="92" font-family="system-ui,sans-serif" font-size="11" fill="#7f8ba0">你读到的:一个「概率」</text>
  <rect x="60" y="104" width="212" height="46" fill="#22303f" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="166" y="135" font-family="'Noto Serif SC',serif" font-size="22" font-weight="700" fill="#7fa0c2" text-anchor="middle">加息概率 ％</text>

  <!-- 箭头:拆开 -->
  <path d="M280 127 L318 127" fill="none" stroke="#2f3b4c" stroke-width="1.6"/>
  <path d="M318 127 l-8 -4 v8 z" fill="#2f3b4c"/>
  <text x="299" y="116" font-family="system-ui,sans-serif" font-size="10" fill="#7f8ba0" text-anchor="middle">拆开</text>

  <!-- 右:两段成分 -->
  <rect x="326" y="104" width="62" height="46" fill="#22303f" stroke="#4f6b8a" stroke-width="1.6"/>
  <text x="357" y="133" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#7fa0c2" text-anchor="middle">判断</text>
  <rect x="388" y="104" width="232" height="46" fill="#2a1e1c" stroke="#a8453a" stroke-width="1.6"/>
  <text x="504" y="133" font-family="'Noto Serif SC',serif" font-size="13" font-weight="700" fill="#c56a5c" text-anchor="middle">输不起的人多付的钱</text>
  <text x="357" y="168" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a" text-anchor="middle">一小截</text>
  <text x="504" y="168" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a" text-anchor="middle">一大截</text>

  <!-- 到期归零 -->
  <line x1="60" y1="212" x2="620" y2="212" stroke="#2f3b4c" stroke-width="1.2"/>
  <line x1="472" y1="196" x2="472" y2="228" stroke="#c8a96a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="472" y="243" font-family="system-ui,sans-serif" font-size="10.5" fill="#c8a96a" text-anchor="middle">决议落地</text>
  <path d="M72 200 Q300 190 466 198" fill="none" stroke="#a8453a" stroke-width="1.8"/>
  <path d="M478 198 L494 212 L620 212" fill="none" stroke="#a8453a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="180" y="192" font-family="system-ui,sans-serif" font-size="10.5" fill="#a8453a">保费一路被推高</text>
  <text x="556" y="205" font-family="system-ui,sans-serif" font-size="10.5" fill="#7f8ba0" text-anchor="middle">归零 / 归一</text>

  <line x1="48" y1="258" x2="632" y2="258" stroke="#2a3342" stroke-width="1"/>
  <text x="340" y="284" font-family="'Noto Serif SC',serif" font-size="14" font-weight="700" fill="#c8a96a" text-anchor="middle">「加息概率」不是市场的预测,是保险的报价</text>
</svg>
