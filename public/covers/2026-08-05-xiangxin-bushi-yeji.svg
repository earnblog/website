<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:生意几乎没动,价格却直窜上去,跳开的那一截是相信">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16.5" font-weight="700" fill="#c8a96a">生意几乎没动,价格却直窜上去——跳开的不是业绩,是相信</text>

  <line x1="88" y1="256" x2="624" y2="256" stroke="#3a4556" stroke-width="1.2"/>

  <!-- 四十倍:市场愿意付的高度 -->
  <line x1="360" y1="92" x2="624" y2="92" stroke="#b07d33" stroke-width="1.1" stroke-dasharray="5 5"/>
  <text x="624" y="84" font-family="system-ui,sans-serif" font-size="10.5" fill="#c8a96a" text-anchor="end">市场愿付 ≈ 它一年营收的四十倍</text>

  <!-- 公司·生意:蓝,缓慢平抬,已经发生的事 -->
  <path d="M96 214 L200 208 L320 200 L440 192 L560 184" fill="none" stroke="#4f6b8a" stroke-width="2.8"/>
  <circle cx="560" cy="184" r="4.5" fill="#4f6b8a"/>
  <text x="150" y="230" font-family="system-ui,sans-serif" font-size="10.5" fill="#4f6b8a">公司·生意（收入,记的是过去)</text>

  <!-- 价格·相信:金,先贴着生意走,末端一记暴跳 -->
  <path d="M96 218 L200 210 L320 202 L440 190 L520 182 L600 100" fill="none" stroke="#c8a96a" stroke-width="2.8"/>
  <circle cx="600" cy="100" r="5" fill="#c8a96a"/>
  <text x="600" y="90" font-family="system-ui,sans-serif" font-size="10.5" fill="#c8a96a" text-anchor="end">价格·相信 · 一天跳涨近三成</text>

  <!-- 跳开的那一截 = 相信 -->
  <line x1="614" y1="104" x2="614" y2="182" stroke="#a8453a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="628" y="146" font-family="system-ui,sans-serif" font-size="10.5" fill="#c06a5e">这一截:相信</text>

  <text x="356" y="286" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6" text-anchor="middle">四十倍市销率撑住的不是地基,是一台顺着转多顺、倒着转就多险的机器</text>
</svg>
