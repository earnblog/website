<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="封面:左边是一张由无数节点织成的深蓝色网络,密密麻麻,谁也叫不停;右边是一枚孤零零的金色按钮,按钮下方一根本该装满的储备条,一夜之间从顶端跌到只剩一道细线">
  <rect width="680" height="300" fill="#181f2b"/>
  <text x="48" y="42" font-family="'Noto Serif SC',serif" font-size="16" font-weight="700" fill="#c8a96a">被掏空的不是网络,是一张欠条</text>
  <text x="48" y="66" font-family="system-ui,sans-serif" font-size="10.5" fill="#8a94a6">2026-09-06 Liquid Network储备蒸发95% · 主链未停一分钟</text>

  <!-- divider -->
  <line x1="340" y1="86" x2="340" y2="256" stroke="#33404f" stroke-width="1" opacity="0.6"/>

  <!-- left: distributed network -->
  <g stroke="#4f6b8a" stroke-width="1" opacity="0.85">
    <line x1="80" y1="120" x2="140" y2="150"/>
    <line x1="140" y1="150" x2="100" y2="190"/>
    <line x1="100" y1="190" x2="170" y2="210"/>
    <line x1="170" y1="210" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="140" y2="150"/>
    <line x1="220" y1="160" x2="270" y2="200"/>
    <line x1="80" y1="120" x2="150" y2="100"/>
    <line x1="150" y1="100" x2="220" y2="160"/>
    <line x1="100" y1="190" x2="150" y2="240"/>
    <line x1="150" y1="240" x2="270" y2="200"/>
    <line x1="270" y1="200" x2="200" y2="230"/>
    <line x1="150" y1="100" x2="270" y2="130"/>
    <line x1="270" y1="130" x2="270" y2="200"/>
  </g>
  <g fill="#c8a96a">
    <circle cx="80" cy="120" r="4.5"/>
    <circle cx="150" cy="100" r="4.5"/>
    <circle cx="140" cy="150" r="4.5"/>
    <circle cx="220" cy="160" r="4.5"/>
    <circle cx="270" cy="130" r="4.5"/>
    <circle cx="100" cy="190" r="4.5"/>
    <circle cx="170" cy="210" r="4.5"/>
    <circle cx="270" cy="200" r="4.5"/>
    <circle cx="150" cy="240" r="4.5"/>
    <circle cx="200" cy="230" r="4.5"/>
  </g>
  <text x="175" y="272" font-family="'Noto Serif SC',serif" font-size="11" fill="#9fb0bf" text-anchor="middle">比特币主链 · 谁也叫不停</text>

  <!-- right: federation button + draining reserve bar -->
  <g>
    <circle cx="470" cy="120" r="20" fill="#1c2330" stroke="#c8a96a" stroke-width="2"/>
    <circle cx="470" cy="120" r="8" fill="#a8453a"/>
    <line x1="470" y1="140" x2="470" y2="160" stroke="#c8a96a" stroke-width="2"/>
    <text x="470" y="104" font-family="system-ui,sans-serif" font-size="9.5" fill="#e0b3a8" text-anchor="middle">几把钥匙</text>

    <!-- reserve bar container -->
    <rect x="440" y="160" width="60" height="96" fill="none" stroke="#8a94a6" stroke-width="1.2"/>
    <!-- near-empty fill -->
    <rect x="440" y="252" width="60" height="4" fill="#a8453a"/>
    <!-- ghost of former full level -->
    <rect x="440" y="160" width="60" height="92" fill="none" stroke="#4f6b8a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="470" y="146" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">此前四千余枚</text>
    <text x="512" y="256" font-family="'Noto Serif SC',serif" font-size="11" fill="#e0b3a8">只剩197枚</text>
  </g>
  <text x="470" y="272" font-family="'Noto Serif SC',serif" font-size="11" fill="#9fb0bf" text-anchor="middle">联邦侧链 · 一次签名清空</text>

  <text x="48" y="292" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">欠条能被撕,主链分毫未动</text>
</svg>
